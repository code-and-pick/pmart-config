# local 프로필 공통 — 개발자 PC 의 deploy/local docker compose(localhost). 로컬 컨테이너 전용 고정값.
spring:
  kafka:
    bootstrap-servers: localhost:9092
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8501/api/v1/internal/jwks
management:
  tracing:
    export:
      zipkin:
        endpoint: http://localhost:9411/api/v2/spans
logging:
  level:
    com.pmart: DEBUG
# 승인 번호(approvalRef)를 확인 없이 기록만 — 승인 서비스 연동 전 개발 환경 전용(2026-11-08 외부 검토 #8). prod 에는 넣지 않는다:
# 없으면 재고 해제·폐기·실사 조정·재고 정정·운영 제한 해제가 CONFIG_REQUIRED.
pmart.approval-ref.mode: RECORD_ONLY

# 믿는 발급자 표(ADR-0054) — 게이트웨이·모든 서비스(common-security)가 토큰 iss 로 발급자를 고르고, 사용자 종류는 그 발급자가 낼 수 있는 것만 인정한다.
# 표에 없는 iss 는 401. jwk-set-uri 를 비운 발급자는 위 spring.security.oauth2.resourceserver.jwt.jwk-set-uri(auth-service 자신은 자기 키)로 서명을 확인한다.
# Keycloak(직원, pmart-staff)·rider-auth-service(라이더) 줄이 있다. 배치·확인이 끝나면 auth-service 의 OPERATOR·RIDER 를 뺀다:
#  - OPERATOR: 운영자 로그인을 Keycloak 으로 옮기는 동안 함께 둔다(ADR-0054 D)
#  - RIDER: rider-auth-service 전의 시험 라이더 토큰(LAN 서명키, RD-claude-*) — 로컬 전용
pmart.security.issuers:
  - id: auth-service # 고객·비회원·서비스(+ 이전 기간 운영자·시험 라이더)
    issuer-uri: 'http://localhost:8501'
    audiences: [pmart-api] # ADR-0055 결정 6 — auth-service 가 aud=pmart-api 로 발급(시험 토큰도 aud 필요)
    user-types: [CUSTOMER, GUEST, SERVICE, OPERATOR, RIDER]
  # 라이더 — rider-auth-service(ADR-0054 E·ADR-0055, Google 로그인). RIDER 로만 인정
  - id: rider
    issuer-uri: 'http://localhost:8510'
    jwk-set-uri: 'http://localhost:8510/api/v1/internal/jwks'
    audiences: [pmart-api] # ADR-0055 결정 6
    user-types: [RIDER]
