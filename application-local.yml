# local 프로필 공통 — 개발자 PC 의 deploy/local docker compose(localhost). 로컬 컨테이너 전용 고정값.
spring:
  kafka:
    bootstrap-servers: localhost:9092
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8501/api/v1/internal/jwks
management:
  tracing:
    export:
      zipkin:
        endpoint: http://localhost:9411/api/v2/spans
logging:
  level:
    com.pmart: DEBUG
# 승인 번호(approvalRef)를 확인 없이 기록만 — 승인 서비스 연동 전 개발 환경 전용(2026-11-08 외부 검토 #8). prod 에는 넣지 않는다:
# 없으면 재고 해제·폐기·실사 조정·재고 정정·운영 제한 해제가 CONFIG_REQUIRED.
pmart.approval-ref.mode: RECORD_ONLY
