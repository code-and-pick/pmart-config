# local 프로필 공통 — 개발자 PC 의 deploy/local docker compose(localhost). 로컬 컨테이너 전용 고정값.
spring:
  kafka:
    bootstrap-servers: localhost:9092
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8501/api/v1/internal/jwks
management:
  tracing:
    export:
      zipkin:
        endpoint: http://localhost:9411/api/v2/spans
logging:
  level:
    com.pmart: DEBUG
