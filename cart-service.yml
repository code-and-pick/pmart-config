# cart-service 고유 설정(모든 프로필). 환경별 값은 cart-service-<프로필>.yml, 모든 서비스 공통은 application.yml. ADR-0029
# 옮긴 원본: pmart-backend services/.../application.yml (2026-11-02)
server:
  port: 8104
pmart:
  messaging:
    domain: commerce
  security:
    # 비회원 토큰(typ=GUEST, auth guest-sessions)이 쓸 수 있는 경로. 그 밖(병합 등 회원 전용 판정은 서비스에서)·다른 서비스는 403.
    guest-paths:
      - /api/v1/carts
      - /api/v1/carts/**
  cart:
    retention: P30D # Commerce [채택 설계] 마지막 변경 후 30일 보존
spring:
  # 이벤트 소비(Spring Cloud Stream, ADR-0035): 함수(빈) 이름 → 토픽. 그룹·재시도·DLQ({토픽}.DLT)·커밋은 common-messaging 기본값.
  # 함수를 더하거나 빼면 코드(PmartEventConsumer 빈)와 함께 바꾼다 — 빠지면 기동이 멈춘다. 바꾸면 재시작한다
  cloud:
    function:
      definition: orderEvents
    stream:
      bindings:
        orderEvents-in-0:
          destination: order.order.v1
