# customer-service 고유 설정(모든 프로필). 환경별 값은 customer-service-<프로필>.yml, 모든 서비스 공통은 application.yml. ADR-0029
# 옮긴 원본: pmart-backend services/.../application.yml (2026-11-02)
server:
  port: 8103
pmart:
  messaging:
    domain: commerce
  customer:
    # 주소록 최대 건수(프로젝트 설계값, 운영 입력으로 바꾼다). 비우면 주소 추가는 CONFIG_REQUIRED.
    address-limit: 20
    # 약관 동의(CU-1, 사용자 결정 2026-11-17): 항목별 현행 버전. 바꾸면 그 항목을 다시 받는다 — 필수 항목은 다음 로그인(AUTH_CONSENT)·주문 전.
    # 비우면 동의 조회·변경·로그인 동의 판단이 CONFIG_REQUIRED. 약관 원문·구성의 확정은 운영 승인 대상(Commerce 6.2)
    consents:
      versions:
        terms-of-service: '2026-11-17'
        privacy-policy: '2026-11-17'
        age-over-14: '1'
        marketing: '2026-11-17'
        # 위치기반서비스 이용약관(2026-11-19 BR-59) — 현재 위치 기능을 쓸 때만 필수, 로그인·구매 필수 목록에는 없다(기존 회원 재동의 없음)
        location-based-service: '2026-11-19'
      # 수신 동의 처리 결과 안내의 전송자 이름(정보통신망법 — 전송자·일시·처리 내용, BR-59). 앱이 "수신동의 처리완료" 창에 쓴다
      sender-name: PMart
      # 약관 본문 주소 덮어쓰기(항목 키 = versions 와 같은 이름). 비우면 서버가 가진 본문 /api/v1/consent-terms/<항목>/<버전>(2026-11-19 시연용 초안, 회사 PMart)
      documents: {}
      # 구매 가능 여부(내부 계정 상태 purchasable)에 필수 동의를 넣을지 — 기능 스위치(정책값 아님). 고객앱 동의 흐름 반영 뒤 true —
      # CU-1 2026-11-17. 켤 때는 auth-service.yml require-consent 와 함께 true(하나만 켜면 동의할 길 없이 주문이 막히거나 묻기만 한다)
      purchase-gate: true # 2026-11-19 사용자 "켜줘"(CU-1) — require-consent 와 함께
    # 휴대폰 번호 확인(2026-11-19 사용자 "옥토모로" — OCTOMO, 고객이 대표번호로 문자를 보냄). api-key 는 <프로필>.yml 의 {cipher}.
    # 하나라도 없으면 시작·확인 CONFIG_REQUIRED. 바꾸면 재시작. 조회마다 OCTOMO 월 한도(무료 1만 건)가 준다 — max-attempts·max-starts-per-day 로 막는다
    phone-verification:
      octomo-base-url: https://api.octoverse.kr
      send-to: '1666-3538'
      ttl: PT10M
      within-minutes: 10
      max-attempts: 5
      max-starts-per-day: 10
    # 로그인 제공자 프로필 사진의 우리 사본(ADR-0024). 기술 설정값(업무 정책 아님). 받는 곳은 허용 호스트의 https 만
    profile-image:
      allowed-host-suffixes: googleusercontent.com
      size-px: 256
      max-bytes: 1048576
  security:
    # 계약 security: [] 작업(익명). 기본 목록을 덮어쓰므로 actuator·error 도 다시 적는다. 경로마다 메서드가 하나뿐이라 경로 단위 허용이 계약과 일치.
    permit-paths:
      - /actuator/health/**
      - /actuator/info
      - /actuator/prometheus
      - /error
      - /api/v1/guest-delivery-addresses
      - /api/v1/guest-delivery-addresses/*
      - /api/v1/device-consents # 로그인 전 기기 동의(2026-11-19 BR-59) — GET 만
      - /api/v1/device-consent-changes # POST 만
      - /api/v1/consent-terms # GET 만
      - /api/v1/consent-terms/*/* # 약관 본문(0.6.1) — GET 만
spring:
  # 이벤트 소비(Spring Cloud Stream, ADR-0035): 함수(빈) 이름 → 토픽. 그룹·재시도·DLQ({토픽}.DLT)·커밋은 common-messaging 기본값.
  # 함수를 더하거나 빼면 코드(PmartEventConsumer 빈)와 함께 바꾼다 — 빠지면 기동이 멈춘다. 바꾸면 재시작한다
  cloud:
    function:
      definition: authEvents;orderEvents
    stream:
      bindings:
        authEvents-in-0:
          destination: platform.auth.v1
        orderEvents-in-0:
          destination: order.order.v1
