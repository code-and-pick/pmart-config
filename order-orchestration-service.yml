# order-orchestration-service 고유 설정(모든 프로필). 환경별 값은 order-orchestration-service-<프로필>.yml, 모든 서비스 공통은 application.yml. ADR-0029
# 옮긴 원본: pmart-backend services/.../application.yml (2026-11-02)
server:
  port: 8202
pmart:
  messaging:
    domain: order
  orchestration:
    stuck-after: PT30S # RUNNING·COMPENSATING 이 이만큼 멈추면 sweep 이 같은 키로 이어서 진행
    sweep-interval: PT10S
    # 결제 전 자원 점유(재고 예약·센터 여력·배송 슬롯) 유효시간. MFC 문서 §6 Q-04 결정(2026-11-07, 사용자) 10분, ADR-0042.
    # 없으면 새 결제 진입 CONFIG_REQUIRED
    hold-ttl: PT10M
spring:
  # 이벤트 소비(Spring Cloud Stream, ADR-0035): 함수(빈) 이름 → 토픽. 그룹·재시도·DLQ({토픽}.DLT)·커밋은 common-messaging 기본값.
  # 함수를 더하거나 빼면 코드(PmartEventConsumer 빈)와 함께 바꾼다 — 빠지면 기동이 멈춘다. 바꾸면 재시작한다
  cloud:
    function:
      definition: claimEvents;paymentEvents;orderEvents;fulfillmentEvents;caseEvents;deliveryEvents
    stream:
      bindings:
        claimEvents-in-0:
          destination: order.claim.v1
        orderEvents-in-0: # OrderConfirmed → S2 이행 요청(슬라이스 6a, 2026-11-07)
          destination: order.order.v1
        paymentEvents-in-0:
          destination: order.payment.v1
        fulfillmentEvents-in-0: # LineShortageReported → 결품 사가(IV-09 2부, ADR-0045, 2026-11-07)
          destination: mfc.fulfillment.v1
        caseEvents-in-0: # MisdeliveryConfirmed → 오배송 재발송 사가(2026-11-16, ADR-0052 결정 4). 처음 켜기 전 시작 위치 latest
          destination: platform.case.v1
        deliveryEvents-in-0: # RedeliveryPaymentRequired → 다시 배송 9,000원 결제 대기(2026-11-16, ADR-0065). 처음 켜기 전 시작 위치 latest
          destination: delivery.delivery.v1
