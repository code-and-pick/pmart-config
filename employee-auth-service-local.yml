# employee-auth-service local 프로필 — 개발자 PC(deploy/local docker compose, localhost). 로컬 전용 고정값. ADR-0029
# 로컬에는 Keycloak 이 없다 — 로그인 시작은 CONFIG_REQUIRED. 브라우저 로그인 시험은 통합 시험(Keycloak 컨테이너)으로 한다.
# 로컬에서 직원 API 를 직접 불러 볼 토큰은 dev-token-mint(POST /api/v1/internal/dev-tokens — 운영자 ID·역할·센터를 주면 바로 발급,
# 2026-11-13). 로컬 전용 — lan·prod 설정에는 넣지 않는다. 도우미: deploy/lan/checks/staff_auth.py local_staff_token()
spring:
  datasource:
    url: jdbc:postgresql://localhost:15432/employee_auth_service
    username: pmart
    password: pmart-local
pmart:
  employee-auth:
    issuer: http://localhost:8511
    center-master-base-url: http://localhost:8507 # 세션 응답 센터 이름(0.9.0, 2026-11-16) — LAN 은 기본값 http://center-master-service:8507
    signing:
      ephemeral: true # 로컬 전용 임시 키. 재시작하면 기존 토큰 무효
    apps:
      backoffice:
        return-uris: ['http://localhost:5173/auth/callback']
      hr-backoffice:
        return-uris: ['http://localhost:5174/auth/callback']
      mfc-backoffice:
        return-uris: ['http://localhost:5175/auth/callback']
    dev-token-mint:
      enabled: true
