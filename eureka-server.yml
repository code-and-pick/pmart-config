# eureka-server 고유 설정(모든 프로필). ADR-0032 — local·LAN 의 서비스 등록·조회. 운영(Kubernetes)은 띄우지 않는다.
server:
  port: 8761
spring:
  security:
    user:
      name: pmart
      password: ${PMART_EUREKA_PASSWORD} # 없으면 기동하지 않는다. LAN 은 deploy/lan/.secrets/eureka-password(render.sh 가 넣는다)
eureka:
  client:
    enabled: true # 서버 자동 구성이 클라이언트 설정 빈을 쓴다. 자신은 등록·조회하지 않는다(단일 노드)
    register-with-eureka: false
    fetch-registry: false
  server:
    # 자가 보존(갱신이 갑자기 줄면 지우지 않음)은 끈다: 개발 환경은 재배포·PC 재시작이 잦아 죽은 인스턴스가 남는 편이 더 해롭다
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 10000
    wait-time-in-ms-when-sync-empty: 0 # 동기화할 다른 서버가 없다
# 업무 API 가 없다 — convention 이 넣는 springdoc 문서 엔드포인트를 끈다
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
