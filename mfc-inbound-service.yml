# mfc-inbound-service 고유 설정(모든 프로필). 환경별 값은 mfc-inbound-service-<프로필>.yml, 모든 서비스 공통은 application.yml. ADR-0029
# 옮긴 원본: pmart-backend services/.../application.yml (2026-11-02)
server:
  port: 8306
pmart:
  messaging:
    domain: mfc
  inbound:
    # PENDING 반입 전기·재시도 주기
    post-interval: PT3S
spring:
  # 이벤트 소비(Spring Cloud Stream, ADR-0035): 함수(빈) 이름 → 토픽. 그룹·재시도·DLQ({토픽}.DLT)·커밋은 common-messaging 기본값.
  # 함수를 더하거나 빼면 코드(PmartEventConsumer 빈)와 함께 바꾼다 — 빠지면 기동이 멈춘다. 바꾸면 재시작한다
  cloud:
    function:
      definition: approvalEvents;inventoryEvents;qualityEvents
    stream:
      bindings:
        approvalEvents-in-0:
          destination: platform.approval.v1
        inventoryEvents-in-0: # 재고 변동 → 자동 보충 즉시 점검(2026-11-08)
          destination: mfc.inventory.v1
        qualityEvents-in-0: # mfc-quality ReturnInspected → 재판매 회수품 적치 작업(IV-10, 2026-11-08)
          destination: mfc.quality.v1
