# lan 프로필 공통 — LAN 공유 개발 환경(pc2·pc3·pc4 docker compose). 이름은 compose 서비스명·extra_hosts 로 어느 PC 에서나 같다.
spring:
  kafka:
    bootstrap-servers: kafka-1:9092,kafka-2:9092,kafka-3:9092 # KRaft 3노드 클러스터(ADR-0037) — 하나만 적으면 그 노드가 꺼진 채 시작할 때 붙지 못한다
  # 실행 중 설정 갱신(ADR-0033): 이 저장소에 push → GitHub 웹훅(smee.io 중계) → config-server /monitor → Bus(Kafka springCloudBus)
  # → 바뀐 파일의 앱(<앱>*.yml → 그 앱, application*.yml → 모든 앱)이 config-server 에서 다시 받는다. 기본 꺼짐(common-observability).
  # 다시 읽히는 것: @ConfigurationProperties(setter 형)·logging.level·gateway 라우트. DB·Kafka 주소·켜고 끄는 값·record 형 설정은 재시작.
  cloud:
    bus:
      enabled: true
    # Bus 소비 그룹: 기본은 인스턴스마다 무작위 anonymous.* 라 재시작마다 빈 그룹이 쌓인다(2026-11-04 정리 때 138개).
    # 인스턴스마다 다른 고정 이름으로 둔다 — 같은 이름을 두 인스턴스가 쓰면 알림이 한쪽에만 간다. LAN 은 render.sh 가 PC 이름을,
    # Kubernetes 는 HOSTNAME(파드 이름)을 쓴다. 새 그룹은 뜬 뒤의 알림만 받는다(지난 알림을 다시 처리하지 않게).
    stream:
      bindings:
        springCloudBusInput:
          group: bus-${spring.application.name}-${PMART_BUS_INSTANCE:${HOSTNAME:local}}
      kafka:
        bindings:
          springCloudBusInput:
            consumer:
              start-offset: latest
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://auth-service:8501/api/v1/internal/jwks
  datasource:
    hikari:
      maximum-pool-size: 5 # PC 하나의 PostgreSQL 을 서비스 십여 개가 나눠 쓴다(max_connections 200)
management:
  tracing:
    export:
      zipkin:
        endpoint: http://zipkin:9411/api/v2/spans
# 서비스 등록·조회(Eureka, ADR-0032). 각 앱은 자기 PC 의 LAN IP + 공개 포트로 등록한다(컨테이너 IP 는 다른 PC 에서 닿지 않는다).
# PMART_HOST_IP·PMART_EUREKA_PASSWORD 는 deploy/lan/render.sh 가 compose 환경변수로 넣는다. 공개 포트 = 컨테이너 포트 = server.port.
# 서비스 간 호출(common-web)과 게이트웨이(lb://)가 주소의 호스트 이름을 서비스 이름으로 보고 등록된 인스턴스로 바꾼다.
eureka:
  client:
    enabled: true
    service-url:
      defaultZone: 'http://pmart:${PMART_EUREKA_PASSWORD}@eureka-server:8761/eureka/'
    registry-fetch-interval-seconds: 10 # 기본 30초. 재배포 뒤 새 주소를 빨리 받는다
    healthcheck:
      enabled: true # actuator health 가 DOWN 이면 Eureka 에도 DOWN 으로 올린다(호출 대상에서 빠진다)
    refresh:
      # 설정 갱신(Bus) 때 Eureka 클라이언트를 다시 만들지 않는다 — 다시 만들면 등록 해제 → 재등록 사이에 게이트웨이가 503(ADR-0033).
      # eureka.* 를 바꾸면 재시작한다
      enable: false
  instance:
    prefer-ip-address: true
    ip-address: ${PMART_HOST_IP}
    instance-id: '${spring.application.name}:${PMART_HOST_IP}:${server.port}' # 나중에 같은 서비스를 더 띄워도 겹치지 않게
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30 # 갱신이 30초 없으면 서버가 지운다(서버 쪽 eviction 10초)
logging:
  level:
    # 이 두 로거는 접속 실패 때 defaultZone 주소를 사용자·비밀번호째 찍는다(2026-11-03 LAN 에서 확인) — 끈다.
    # 실패 자체는 com.netflix.discovery.DiscoveryClient 가 주소 없이 남긴다
    com.netflix.discovery.shared.transport.decorator.RetryableEurekaHttpClient: 'OFF'
    com.netflix.discovery.shared.transport.decorator.RedirectingEurekaHttpClient: 'OFF'
    # Eureka 클라이언트가 eureka-server 자신을 등록부에서 찾을 때(등록 대상 아님) 10초마다 "No servers available" WARN —
    # LoadBalancedInterceptor 는 등록이 없으면 원래 주소로 보낸다(정상 동작). 등록 없는 다른 서비스도 같은 경로라 놓치는 정보는
    # 연결 실패(Downstream → DEPENDENCY_UNAVAILABLE)로 남는다(2026-11-04)
    org.springframework.cloud.loadbalancer.core.RoundRobinLoadBalancer: ERROR
# 승인 번호(approvalRef)를 확인 없이 기록만 — 승인 서비스 연동 전 개발 환경 전용(2026-11-08 외부 검토 #8). prod 에는 넣지 않는다:
# 없으면 재고 해제·폐기·실사 조정·재고 정정·운영 제한 해제가 CONFIG_REQUIRED.
pmart.approval-ref.mode: RECORD_ONLY

# 믿는 발급자 표(ADR-0054) — 게이트웨이·모든 서비스(common-security)가 토큰 iss 로 발급자를 고르고, 사용자 종류는 그 발급자가 낼 수 있는 것만 인정한다.
# 표에 없는 iss 는 401. jwk-set-uri 를 비운 발급자는 위 spring.security.oauth2.resourceserver.jwt.jwk-set-uri(auth-service 자신은 자기 키)로 서명을 확인한다.
# 직원은 employee-auth-service(staff-ea), 라이더는 rider-auth-service 줄. Keycloak(pmart-staff) 토큰 줄은 2026-11-13 뺐다 —
# Keycloak 은 신원만 확인하고 Keycloak 역할을 PMart 권한으로 믿지 않는다(ADR-0056 U-11: hr-service 의 manage-users 로 역할을 붙여 권한을 올리는 길 차단).
# 배치·확인이 끝나면 auth-service 의 OPERATOR 를 뺀다:
#  - OPERATOR: 운영자 로그인을 Keycloak 으로 옮기는 동안 함께 둔다(ADR-0054 D)
#  - RIDER 는 2026-11-11 뺐다(rider-auth-service LAN 배치·확인 뒤). 시험 라이더 토큰은 rider-auth-service 서명키로 만든다
pmart.security.issuers:
  - id: auth-service # 고객·비회원·서비스(+ 이전 기간 운영자)
    issuer-uri: 'http://auth-service:8501'
    audiences: [pmart-api] # ADR-0055 결정 6 — auth-service 가 aud=pmart-api 로 발급(시험 토큰도 aud 필요)
    user-types: [CUSTOMER, GUEST, SERVICE, OPERATOR]
  # 직원 — employee-auth-service(PC5, ADR-0056 3단계). Keycloak 은 신원만, 직원 토큰은 이 서비스가 발급(예전 운영자 토큰 모양).
  - id: staff-ea
    issuer-uri: 'http://employee-auth-service:8511'
    jwk-set-uri: 'http://employee-auth-service:8511/api/v1/internal/jwks'
    audiences: [pmart-api]
    user-types: [OPERATOR]
  # 라이더 — rider-auth-service(PC5, ADR-0054 E·ADR-0055, Google 로그인). 이 발급자의 토큰은 RIDER 로만 인정한다.
  - id: rider
    issuer-uri: 'http://rider-auth-service:8510'
    jwk-set-uri: 'http://rider-auth-service:8510/api/v1/internal/jwks'
    audiences: [pmart-api] # ADR-0055 결정 6
    user-types: [RIDER]
