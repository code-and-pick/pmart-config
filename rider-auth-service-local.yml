# rider-auth-service local 프로필 — 개발자 PC(deploy/local docker compose, localhost). 로컬 전용 고정값. ADR-0029
spring:
  datasource:
    url: jdbc:postgresql://localhost:15432/rider_auth_service
    username: pmart
    password: pmart-local
pmart:
  rider-auth:
    issuer: http://localhost:8510
    signing:
      ephemeral: true # 로컬 전용 임시 키. 재시작하면 기존 토큰 무효
