# payment-service 고유 설정(모든 프로필). 환경별 값은 payment-service-<프로필>.yml
server:
  port: 8205
pmart:
  messaging:
    domain: order
  web:
    # 토스 웹훅은 PG 가 보내는 요청이라 Idempotency-Key·X-Source-System 이 없다(계약에도 없음). 중복은 본문 해시로 거른다
    excluded-paths:
      - /api/v1/webhooks/toss
  payment:
    reconcile-interval: PT15S # 불명 재조회·만료 정리 주기
    # 토스페이먼츠 결제위젯(결제 명세 §7). 키는 환경별 파일에서({cipher}). 비어 있으면 결제 시작은 CONFIG_REQUIRED
    toss:
      base-url: https://api.tosspayments.com
      allow-live-keys: false # 운영만 true. false 인데 live_ 키면 기동 거부
      connect-timeout: PT3S
      read-timeout: PT15S
      webhook-secret: "" # 비면 웹훅을 모두 401(대사는 재조회 작업이 맡음)
  security:
    # 계약 security: [] 작업(익명). 기본 목록을 덮어쓰므로 actuator·error 도 다시 적는다. 경로마다 메서드가 하나뿐이라 경로 단위 허용이 계약과 일치.
    permit-paths:
      - /actuator/health/**
      - /actuator/info
      - /actuator/prometheus
      - /error
      - /api/v1/webhooks/toss
