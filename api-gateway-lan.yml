# api-gateway lan 프로필 — LAN 공유 개발 환경. 비밀값은 {cipher}(암호화: ./gradlew :platform-services:config-server:configCipher). ADR-0029
spring:
  data:
    redis:
      url: 'redis://redis:6379' # 처리율 제한 토큰 버킷 상태만 둔다(원장 아님)
pmart:
  gateway:
    rate-limit:
      # 앞에 Ingress 가 없다(클라이언트가 게이트웨이에 바로 붙는다). 1 이면 클라이언트가 보낸 X-Forwarded-For 를 믿어
      # IP 단위 제한을 우회할 수 있다 → 연결 주소를 쓴다. 운영은 api-gateway.yml 기본값 1(Ingress 1단)
      trusted-proxies: 0
    cors:
      allowed-origins: 'http://d603-16'
    # 업스트림은 Eureka 에서 찾는다(ADR-0032, lb://<서비스 이름>). 등록이 없으면 503
    upstream:
      product-service: lb://product-service
      product-content-service: lb://product-content-service
      customer-service: lb://customer-service
      cart-service: lb://cart-service
      search-service: lb://search-service
      storefront-service: lb://storefront-service
      pricing-service: lb://pricing-service
      order-service: lb://order-service
      order-orchestration-service: lb://order-orchestration-service
      fulfillment-routing-service: lb://fulfillment-routing-service
      claim-service: lb://claim-service
      payment-service: lb://payment-service
      mfc-inventory-service: lb://mfc-inventory-service
      mfc-fulfillment-service: lb://mfc-fulfillment-service
      cdc-inventory-service: lb://cdc-inventory-service
      mfc-capacity-service: lb://mfc-capacity-service
      mfc-location-service: lb://mfc-location-service
      mfc-quality-service: lb://mfc-quality-service
      mfc-inbound-service: lb://mfc-inbound-service
      delivery-serviceability-service: lb://delivery-serviceability-service
      delivery-capacity-service: lb://delivery-capacity-service
      rider-service: lb://rider-service
      delivery-dispatch-service: lb://delivery-dispatch-service
      delivery-execution-service: lb://delivery-execution-service
      delivery-tracking-service: lb://delivery-tracking-service
      auth-service: lb://auth-service
      notification-service: lb://notification-service
      audit-service: lb://audit-service
      backoffice-bff: lb://backoffice-bff
      approval-service: lb://approval-service
      case-service: lb://case-service
      center-master-service: lb://center-master-service
      ai-assistant-service: lb://ai-assistant-service
