# pricing-service 고유 설정(모든 프로필). 환경별 값은 pricing-service-<프로필>.yml, 모든 서비스 공통은 application.yml. ADR-0029
# 옮긴 원본: pmart-backend services/.../application.yml (2026-11-02)
server:
  port: 8107
spring:
  servlet:
    multipart:
      max-file-size: 300MB # 가격 일괄 등록 seed-v1 묶음(이미지 포함, 상품 일괄 등록과 같은 파일). 이 서비스는 product.json 만 읽는다
      max-request-size: 300MB
pmart:
  messaging:
    domain: commerce
  security:
    # 계약 security: [] 작업(비회원 둘러보기 표시 가격). 기본 목록을 덮어쓰므로 actuator·error 도 다시 적는다. 두 경로 모두 GET 하나뿐이라 경로 단위 허용이 계약과 일치.
    permit-paths:
      - /actuator/health/**
      - /actuator/info
      - /actuator/prometheus
      - /error
      - /api/v1/prices
      - /api/v1/prices/*
