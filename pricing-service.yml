# pricing-service 고유 설정(모든 프로필). 환경별 값은 pricing-service-<프로필>.yml, 모든 서비스 공통은 application.yml. ADR-0029
# 옮긴 원본: pmart-backend services/.../application.yml (2026-11-02)
server:
  port: 8107
spring:
  servlet:
    multipart:
      max-file-size: 300MB # 가격 일괄 등록 seed-v1 묶음(이미지 포함, 상품 일괄 등록과 같은 파일). 이 서비스는 product.json 만 읽는다
      max-request-size: 300MB
  # 이벤트 소비(Spring Cloud Stream, ADR-0035): 함수(빈) 이름 → 토픽. 그룹·재시도·DLQ({토픽}.DLT)·커밋은 common-messaging 기본값.
  # 함수를 더하거나 빼면 코드(PmartEventConsumer 빈)와 함께 바꾼다 — 빠지면 기동이 멈춘다. 바꾸면 재시작한다
  cloud:
    function:
      definition: approvalEvents;productEvents
    stream:
      bindings:
        approvalEvents-in-0:
          destination: platform.approval.v1
        productEvents-in-0:
          destination: commerce.product.v1
pmart:
  messaging:
    domain: commerce
  security:
    # 계약 security: [] 작업(비회원 둘러보기 표시 가격). 기본 목록을 덮어쓰므로 actuator·error 도 다시 적는다. 두 경로 모두 GET 하나뿐이라 경로 단위 허용이 계약과 일치.
    permit-paths:
      - /actuator/health/**
      - /actuator/info
      - /actuator/prometheus
      - /error
      - /api/v1/prices
      - /api/v1/prices/*
