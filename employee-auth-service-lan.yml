# employee-auth-service lan 프로필 — LAN 공유 개발 환경(PC 5, ADR-0056). 비밀값은 {cipher}(암호화: ./gradlew :platform-services:config-server:configCipher). ADR-0029
spring:
  datasource:
    url: 'jdbc:postgresql://postgres-pc5:15432/employee_auth_service'
    username: 'pmart'
    password: '{cipher}29eb4261f88151e247af86806e860a904c44358f8aa451229e5c6661766a668aa2ca9a5a94475f10d8e101b46b97e59bdcf5ae825a69c15c63c67bbb74d9fbff7e7ae41afa56c0045558aec968b87ef1'
pmart:
  employee-auth:
    issuer: 'http://employee-auth-service:8511'
    # 직원 토큰 서명키(PKCS#8 PEM, 첫 키가 활성) — 다른 발급자와 다른 키. 원본 deploy/lan/.secrets/employee-auth-signing-key.pem(git 제외)
    signing:
      keys:
        - kid: 'employee-lan-20261112'
          private-key: '{cipher}'
    # Signed Double-Submit CSRF 값의 HMAC 키(ADR-0059, 2026-11-14 켬). 원본 deploy/lan/.secrets/employee-auth-csrf-key
    refresh-cookie:
      csrf-key: '{cipher}c63c4c601942c611767f8ab5a17f77f2ecfc9f70742bcb9ba966e5f90a60683384bcfe475254d81b8575403b3f58578303e5e6b60df9acc7ecd99f04d2e7a4ceb50f3fb14a0239770e33353f9eeb258775a227ce68b36fdebdfb88d940c25cf4'
    apps:
      backoffice:
        # refresh token 을 세션별 HttpOnly 쿠키로(ADR-0059) — 클라이언트 web/core 05f7933 반영 뒤 2026-11-14 켬
        refresh-cookie: true
        return-uris:
          - 'http://localhost:5173/auth/callback'
          - 'https://192.168.0.40/auth/callback' # HTTPS 만(ADR-0057, 2026-11-13 HTTP 닫음)
          - 'https://d603-16/auth/callback'
      # 인사팀 백오피스(별도 앱, 2026-11-13 사용자 결정 — PC 4 :8081, 개발 :5174)
      hr-backoffice:
        refresh-cookie: true
        return-uris:
          - 'http://localhost:5174/auth/callback'
          - 'https://192.168.0.40:8444/auth/callback'
          - 'https://d603-16:8444/auth/callback'
      # MFC 백오피스(별도 앱, 2026-11-15 — PC 4 https :8445, 개발 :5175)
      mfc-backoffice:
        refresh-cookie: true
        return-uris:
          - 'http://localhost:5175/auth/callback'
          - 'https://192.168.0.40:8445/auth/callback'
          - 'https://d603-16:8445/auth/callback'
    keycloak:
      # ID 토큰 iss = Keycloak KC_HOSTNAME(render.sh) = 게이트웨이 HTTPS /iam(ADR-0056 4단계, 2026-11-12). 브라우저 로그인·로그아웃 주소도 이것에서
      issuer: 'https://192.168.0.40:8443/iam/realms/pmart-staff'
      # 서버끼리 호출은 같은 PC 5 Docker 네트워크 안에서(게이트웨이를 다시 거치지 않는다)
      token-uri: 'http://keycloak:8080/realms/pmart-staff/protocol/openid-connect/token'
      jwk-set-uri: 'http://keycloak:8080/realms/pmart-staff/protocol/openid-connect/certs'
      logout-uri: 'http://keycloak:8080/realms/pmart-staff/protocol/openid-connect/logout'
      # 원본 deploy/lan/.secrets/keycloak-employee-auth-client-secret(Keycloak 클라이언트 employee-auth-service 와 같은 값)
      client-secret: '{cipher}b3cb1efd1d0e41e288753806af907b0dfe3557592ff376891b44fd7162255fa2891d5c7a5633ef8fbbedb75a466b35feddb10a98c12139556cf87f1d9d364c20e14b0e299b9862ab0e0a2db522ff4a04606d581c985ef85458c84b52b614d153'
      # Keycloak 에 등록한 콜백 — 게이트웨이(PC 4) 경유 공개 주소
      redirect-uri: 'https://192.168.0.40:8443/api/v1/employee-auth/logins/callback' # HTTPS(티켓이 주소에 실린다)
    # LAN 시험 스크립트 전용(ADR-0056 D5): pmart-dev-cli 직접 로그인 토큰 → 직원 토큰. prod 에는 두지 않는다
    dev-token-exchange:
      enabled: true
