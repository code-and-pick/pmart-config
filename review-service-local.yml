# review-service local 프로필 — 개발자 PC(deploy/local docker compose, localhost). 로컬 전용 고정값. ADR-0029
spring:
  datasource:
    url: jdbc:postgresql://localhost:15432/review_service
    username: pmart
    password: pmart-local
pmart:
  review:
    order-base-url: http://localhost:8201
    customer-base-url: http://localhost:8103
  storage:
    s3:
      # deploy/local 의 s3(SeaweedFS). 로컬 전용 기본 자격 증명(product-content 와 같음). 버킷이 없으면 만든다(로컬만)
      endpoint: http://localhost:8333
      bucket: pmart-review
      access-key: pmart-local-s3
      secret-key: pmart-local-s3-secret
      region: us-east-1
      path-style: true
      create-bucket: true
