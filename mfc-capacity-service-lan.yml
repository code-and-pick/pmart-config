# mfc-capacity-service lan 프로필 — LAN 공유 개발 환경. 비밀값은 {cipher}(암호화: ./gradlew :platform-services:config-server:configCipher). ADR-0029
spring:
  datasource:
    url: 'jdbc:postgresql://postgres-pc3:15432/mfc_capacity_service'
    username: 'pmart'
    password: '{cipher}29eb4261f88151e247af86806e860a904c44358f8aa451229e5c6661766a668aa2ca9a5a94475f10d8e101b46b97e59bdcf5ae825a69c15c63c67bbb74d9fbff7e7ae41afa56c0045558aec968b87ef1'
pmart:
  capacity:
    # (MFC, 1시간 창)당 수용 단위(정책값). 주문 1건 = 1 단위(시험 정책 2026-10-30). 비우면 Hold·스냅샷은 CONFIG_REQUIRED.
    # 사용자 결정(2026-11-08): 45 = 기본 가동 포장대 4대 × 11.25건/시간(원문 7-1, 기준안 피크 40.1건). 포장대·인원이 늘면 올린다
    units-per-hour: '45'
    expiry-interval: PT30S # TTL 지난 HELD 정리 주기
    receiving: # 오전 입고 수령창·하차면 — 사용자 확정 시작값(2026-11-08). 비우면 CONFIG_REQUIRED
      window-start: '07:00' # Asia/Seoul, 원문 오전 검수 3시간
      window-end: '10:00'
      max-load-units-per-arrival: 360 # 1회 상한 = 원문 물리 상한 9팔레트(검수장 22평)
      total-load-units: 720 # 하루 상한 = 오전 차량 2대(원문 543행 확정 조건 "2대 이상") × 1회 상한 — 2026-11-08 정정
      bay-count: 1 # 검수장 하나 — 차는 순서대로 받음(동시 하차 1대)
    plan: # 배정 추천(WK-09, 2026-11-08). 미설정이면 계산 거절(CONFIG_REQUIRED)
      mfc-fulfillment-base-url: http://mfc-fulfillment-service:8302 # READY·ASSIGNED·IN_PROGRESS 작업 목록 동기 조회
      mfc-inbound-base-url: http://mfc-inbound-service:8306 # 다음 작업 받기 — 이동·보충 지시 조회(작업자 쪽 4단계, 2026-11-08)
      task-minutes: # 작업 유형 → 예상 분. 원문 7장 피킹 7·패킹 4 — 사용자 확정 시작값(2026-11-08), 실측 뒤 조정
        PICK: 7
        PACK: 4
        RETURN: 5 # 임시 구현값(2026-11-08) — fulfillment 늦음 표시의 RETURN PT5M 과 같게, 실측 뒤 조정
        REPLENISH: 5 # 임시 구현값 — 이동·보충 배정 추천(작업자 쪽), 원문에 기준 없음
        MOVE: 5 # 임시 구현값 — 위와 같음
      time-limit: PT5S # CP-SAT 시간 제한(게이트웨이 10초보다 짧게)
      packing-stations: 4 # 동시 PACK 상한 — 원문 기준안 기본 가동 4대, 사용자 확정 시작값(2026-11-08)
      weights: # 목적 순서 — 사용자 결정 Q-08(2026-11-08): 원문 1061행 순서 미배정 → 지연 → (이동시간: 지도 Q-03 뒤) → 편중. 숫자는 그 순서를 보장하는 크기. 필수 조건은 가중치가 아니라 제약. 자동 확정 없음(감독자 확정)
        UNASSIGNED: 1000000
        LATE: 1000
        MAX_LOAD: 10
