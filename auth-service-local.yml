# auth-service local 프로필 — 개발자 PC(deploy/local docker compose, localhost). 로컬 전용 고정값. ADR-0029
spring:
  datasource:
    url: jdbc:postgresql://localhost:15432/auth_service
    username: pmart
    password: pmart-local
pmart:
  auth:
    issuer: http://localhost:8501
    signing:
      ephemeral: true # 로컬 전용 임시 키. 재시작하면 기존 토큰 무효
    customer:
      google:
        # 허용할 ID 토큰 aud = 고객용 Google 웹 클라이언트 ID(고객 앱 serverClientId, ADR-0055). Android 클라이언트 ID 는 넣지 않는다. 비면 CONFIG_REQUIRED
        client-ids: ${PMART_AUTH_CUSTOMER_GOOGLE_CLIENTIDS:}
