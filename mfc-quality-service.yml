# mfc-quality-service 고유 설정(모든 프로필). 환경별 값은 mfc-quality-service-<프로필>.yml, 모든 서비스 공통은 application.yml. ADR-0029
# 옮긴 원본: pmart-backend services/.../application.yml (2026-11-02)
server:
  port: 8305
pmart:
  messaging:
    domain: mfc
spring:
  # 이벤트 소비(Spring Cloud Stream, ADR-0035): 함수(빈) 이름 → 토픽. 그룹·재시도·DLQ·커밋은 common-messaging 기본값.
  cloud:
    function:
      definition: inboundEvents;fulfillmentEvents
    stream:
      bindings:
        inboundEvents-in-0: # mfc-inbound ReturnItemReceived → 회수품 반입 사본(IV-10, 2026-11-08)
          destination: mfc.inbound.v1
        fulfillmentEvents-in-0: # mfc-fulfillment LineShortageReported DAMAGED → 품질 사고(0.6.0, 2026-11-19)
          destination: mfc.fulfillment.v1
