# order-service 고유 설정(모든 프로필). 환경별 값은 order-service-<프로필>.yml, 모든 서비스 공통은 application.yml. ADR-0029
# 옮긴 원본: pmart-backend services/.../application.yml (2026-11-02)
server:
  port: 8201
pmart:
  messaging:
    domain: order
  security:
    # 비회원 토큰(typ=GUEST)도 배송 방식 안내는 된다(주문 초안은 회원만)
    guest-paths:
      - /api/v1/delivery-options
spring:
  # 이벤트 소비(Spring Cloud Stream, ADR-0035): 함수(빈) 이름 → 토픽. 그룹·재시도·DLQ({토픽}.DLT)·커밋은 common-messaging 기본값.
  # 함수를 더하거나 빼면 코드(PmartEventConsumer 빈)와 함께 바꾼다 — 빠지면 기동이 멈춘다. 바꾸면 재시작한다
  cloud:
    function:
      definition: fulfillmentEvents
    stream:
      bindings:
        fulfillmentEvents-in-0: # MFC PreparationStarted → 주문 PREPARING(슬라이스 6b, 2026-11-07)
          destination: mfc.fulfillment.v1
