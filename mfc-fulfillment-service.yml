# mfc-fulfillment-service 고유 설정(모든 프로필). 환경별 값은 mfc-fulfillment-service-<프로필>.yml, 모든 서비스 공통은 application.yml. ADR-0029
# 옮긴 원본: pmart-backend services/.../application.yml (2026-11-02)
server:
  port: 8302
pmart:
  messaging:
    domain: mfc
  fulfillment:
    task-minutes: # 작업 유형별 예상 시간 — 주의 표시 late = 시작 뒤 2배(사용자 결정 Q-09·규모 확정값 2026-11-08). 없으면 late 표시 안 함
      PICK: PT7M
      PACK: PT4M
      RETURN: PT5M
    handover-fence-ttl: # 라이더 인계 허가(fence) 유효시간 — 사용자 결정 D-2(2026-11-08): 모든 센터 기본 3분, 센터별 값이 있으면 그것. 비우면 CONFIG_REQUIRED
      default: PT3M
spring:
  # 이벤트 소비(Spring Cloud Stream, ADR-0035): 함수(빈) 이름 → 토픽. 그룹·재시도·DLQ({토픽}.DLT)·커밋은 common-messaging 기본값.
  # 함수를 더하거나 빼면 코드(PmartEventConsumer 빈)와 함께 바꾼다 — 빠지면 기동이 멈춘다. 바꾸면 재시작한다
  cloud:
    function:
      definition: assignmentEvents;deliveryEvents;inventoryEvents
    stream:
      bindings:
        assignmentEvents-in-0: # mfc-capacity AssignmentPublished → 작업 담당 투영(슬라이스 6b, 2026-11-07)
          destination: mfc.capacity.v1
        deliveryEvents-in-0: # delivery-dispatch 배송 사건 → 배송 배정 투영(라이더 인계 허가 검사, 슬라이스 6c, 2026-11-08 ADR-0047)
          destination: delivery.delivery.v1
        inventoryEvents-in-0: # mfc-inventory ReservationBlocked → 진행 중 피킹 보류 점검(2026-11-08 #5)
          destination: mfc.inventory.v1
