# employee-auth-service 고유 설정(모든 프로필). 환경별 값은 employee-auth-service-<프로필>.yml, 모든 서비스 공통은 application.yml. ADR-0029
# 직원 로그인(Keycloak 기밀 클라이언트 — 인가 코드 + PKCE)·PMart 직원 토큰 발급자·직원 역할·권한 센터 정본(ADR-0056).
# 구독 platform.employee.v1(hr-service 직원 사건)·platform.approval.v1(권한 승인 GRANT), 발행 SubjectBlocked(platform.subject-block.v1 — 직원 정지·퇴사 즉시 차단)·
# GrantApplied(platform.auth.v1)·ApplicationReceiptRecorded(platform.approval-receipt.v1).
server:
  port: 8511
spring:
  # 이벤트 소비(Spring Cloud Stream, ADR-0035): 함수(빈) 이름 → 토픽. 그룹·재시도·DLQ·커밋은 common-messaging 기본값. 바꾸면 재시작
  cloud:
    function:
      definition: employeeEvents;approvalEvents
    stream:
      bindings:
        employeeEvents-in-0:
          destination: platform.employee.v1
        # 직원 권한 승인 ApprovalDecided(type GRANT, ADR-0056 5-4) — 다른 승인 종류는 버린다
        approvalEvents-in-0:
          destination: platform.approval.v1
pmart:
  messaging:
    domain: platform # 발행 토픽 platform.subject-block.v1
  security:
    # 자기 토큰(로그아웃·현재 세션)과 관리 경로는 발급자 표로 검증한다. 공개키·시험 교환은 /internal(게이트웨이 비노출).
    permit-paths:
      - /actuator/health/**
      - /actuator/info
      - /actuator/prometheus
      - /error
      - /api/v1/internal/jwks
      # 계약 security: [] 작업(로그인 시작·콜백·티켓 교환·갱신). 경로마다 메서드가 하나뿐이라 경로 단위 허용이 계약과 일치
      - /api/v1/employee-auth/logins
      - /api/v1/employee-auth/logins/callback
      - /api/v1/employee-auth/tokens
      - /api/v1/employee-auth/tokens/refresh
      - /api/v1/employee-auth/tokens/refresh/* # 쿠키 갱신(ADR-0059) — 토큰 없음, CSRF·소유권은 서비스가 본다
  employee-auth:
    # 수치는 보안 설정값(ADR-0056 결정 2·14): access 15분, 세션 최대 = 근무 12시간, 티켓 60초, 로그인 시도 10분
    access-token-ttl: PT15M
    session-max-age: PT12H
    ticket-ttl: PT60S
    login-attempt-ttl: PT10M
    # 직원 역할 목록(ADR-0056 결정 4·D3). 이 밖의 역할은 저장하지 않는다
    roles:
      - OPERATOR_ADMIN
      - HR_ADMIN
      - CENTER_MASTER_APPROVER
      - CS_AGENT
      - DISPLAY_APPROVER
      - INVENTORY_APPROVER
      - MD
      - MFC_SUPERVISOR
      - MFC_WORKER
      - PRICE_APPROVER
      - PRODUCT_APPROVER
      - SERVICEABILITY_APPROVER
    apps:
      # PDA 앱(mfc_app) — 딥링크로 복귀, 무활동 30분이면 다시 로그인(ADR-0056 결정 14 ③)
      mfc:
        return-uris: ['pmart-mfc://login']
        session-idle: PT30M
      # 백오피스(웹) — 복귀 주소는 환경별 파일. SSO(2026-11-12 사용자 결정): Keycloak 세션을 남겨 새 탭은 비밀번호 없이(Keycloak 세션
      # 무활동 12시간 = Realm 값 그대로), 로그아웃 응답의 idpLogoutUri 로 Keycloak 세션도 끝낸다 → <출처>/login 으로 돌아옴
      backoffice:
        session-idle: PT12H
        sso: true
        post-logout-path: /login
        # refresh token 을 세션별 HttpOnly 쿠키로 + Signed Double-Submit CSRF(ADR-0059). 클라이언트 web/core 가 쿠키 방식으로 바뀐 뒤 켠다
        # (켜면 pmart.employee-auth.refresh-cookie.csrf-key 가 필요 — LAN {cipher})
        refresh-cookie: false
      # 인사팀 백오피스(별도 웹 앱, 2026-11-13 사용자 결정 "SSO 켬") — 백오피스와 같은 값. 같은 브라우저면 한 번 로그인으로 둘 다,
      # 어느 쪽에서 로그아웃해도 Keycloak 세션이 끝난다(다른 앱의 PMart 세션 토큰은 그 앱이 지운다)
      hr-backoffice:
        session-idle: PT12H
        sso: true
        post-logout-path: /login
        # refresh token 을 세션별 HttpOnly 쿠키로 + Signed Double-Submit CSRF(ADR-0059). 클라이언트 web/core 가 쿠키 방식으로 바뀐 뒤 켠다
        # (켜면 pmart.employee-auth.refresh-cookie.csrf-key 가 필요 — LAN {cipher})
        refresh-cookie: false
    keycloak:
      client-id: employee-auth-service
      timeout: PT5S
