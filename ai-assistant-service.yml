# ai-assistant-service 고유 설정(모든 프로필). 환경별 값은 ai-assistant-service-<프로필>.yml, 모든 서비스 공통은 application.yml. ADR-0029·0036
# 1차: 내부 운영자 정책·업무 절차 RAG. 외부 모델 연결 없음(provider=local: 해시 임베딩 + 발췌 답변 = 기준선).
server:
  port: 8508
pmart:
  messaging:
    domain: platform
  assistant:
    model:
      provider: local # local(기준선) | ollama(LAN, ADR-0051 — -lan 에서 켠다) | fake(시험 전용)
      embedding-dim: 384
    processing:
      timeout: 60s # 하드 타임아웃 — 반드시 lease 보다 짧다(기동 검사)
      lease: 120s
      retry-after-seconds: 2
    retrieval:
      candidates: 40
      top-k: 5
      threshold: 0.18 # 기준선 평가(RetrievalEvalIT)로 정한 값. 임계값 미만은 지위로 끌어올리지 않는다
      cosine-weight: 0.6
      keyword-weight: 0.4
      precedence-weight: 0.01
      confirmed-weight: 0.06
      adopted-weight: 0.04
      proposal-weight: 0.02
      assumption-weight: 0.01
      max-answer-chars: 4000 # 발췌 길이 한도 — 온전한 청크 개수를 줄여서 맞춘다(자르지 않음)
      max-chunk-chars: 1500
      min-sentence-overlap: 0.5
    answers:
      store-question: false # 질문 원문 저장 [결정 필요] — 기본은 request_hash 만
      # retention: 30d      # 답변 보존 기간 [결정 필요] — 비어 있으면 지우지 않는다
    ingest:
      prune-grace: 1h # RETIRED·FAILED 스냅숏 수동 정리 유예(lease×2 이상)
