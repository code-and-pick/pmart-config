# promotion-service 고유 설정(모든 프로필). 쿠폰·기간 할인(2026-11-20 ADR-0082). 환경별 값은 promotion-service-<프로필>.yml. ADR-0029
server:
  port: 8109
pmart:
  messaging:
    domain: commerce # 반영 회신은 platform.approval-receipt.v1(코드에서 토픽 지정)
  web:
    # 상태를 바꾸지 않는 조회성 POST — 계약에 Idempotency-Key 가 없다(pricing·order 가 헤더 없이 부른다)
    excluded-paths:
      - /api/v1/internal/price-discounts
      - /api/v1/internal/coupon-quotes
  promotion:
    zone: Asia/Seoul # 쿠폰 사용 기한 "받은 날부터 N일"의 날짜 경계
    display-sync-interval: PT30S
    # 가입 축하 쿠폰 지급 기록(번호 키) 보관 — 처리방침 "지급 후 5년"(2026-11-21 사용자 "추천대로"). 없으면 지우지 않는다
    signup-grant-retention: P1826D # 표시 할인 다시 계산·알림 주기(SkuDisplayDiscountChanged → 검색·홈, ADR-0082 4단계)
spring:
  # 구독(Spring Cloud Stream, ADR-0035). 처음 켤 때 earliest — 상품 사본(SKU → 카테고리)을 처음부터 채운다
  cloud:
    function:
      definition: productEvents;pricingEvents;approvalEvents;customerEvents;orderEvents
    stream:
      bindings:
        productEvents-in-0: # product-service ProductVersionPublished → SKU·카테고리 사본(카테고리 행사 판정)
          destination: commerce.product.v1
        pricingEvents-in-0: # pricing-service PriceVersionEffective → SKU 기본가 사본(표시 할인 — 가장 큰 1개 고르기, ADR-0082 4단계)
          destination: commerce.pricing.v1
        customerEvents-in-0: # customer CustomerIdentityVerified(stage SIGNUP) → 가입 축하 쿠폰(ADR-0082 5단계)
          destination: commerce.customer.v1
        orderEvents-in-0: # order OrderCancelled(DISPATCH_UNAVAILABLE) → 보상 쿠폰(CL-5). 처음 켤 때 latest — 이전 취소는 소급하지 않는다
          destination: order.order.v1
        approvalEvents-in-0: # approval-service ApprovalDecided(PROMOTION) → 행사 발효·조기 종료
          destination: platform.approval.v1
      kafka:
        bindings:
          orderEvents-in-0:
            consumer:
              start-offset: latest # 처음 켤 때 지난 주문 사건을 읽지 않는다(보상 쿠폰 소급 없음)
