# notification-service 고유 설정(모든 프로필). 환경별 값은 notification-service-<프로필>.yml, 모든 서비스 공통은 application.yml. ADR-0029
# 옮긴 원본: pmart-backend services/.../application.yml (2026-11-02)
server:
  port: 8502
pmart:
  messaging:
    domain: platform
# 고객 알림함 구독(Spring Cloud Stream, ADR-0035 — 2026-11-16, 계약 0.2.0). 처음 켜기 전 소비 그룹 시작 위치 = latest(지난 주문에 알림을 몰아 쌓지 않게)
spring:
  cloud:
    function:
      definition: orderEvents;deliveryEvents;claimEvents;paymentEvents;caseEvents;slotEvents
    stream:
      bindings:
        orderEvents-in-0: # 주문 확정·상품 준비 시작·취소·결품 부분 취소
          destination: order.order.v1
        deliveryEvents-in-0: # 배송 출발(PickupCompleted)·완료(DeliveryCompleted)
          destination: delivery.delivery.v1
        claimEvents-in-0: # RefundIntentCreated — 환불 결과를 주문과 잇는다
          destination: order.claim.v1
        paymentEvents-in-0: # RefundResult — 환불 성공·실패
          destination: order.payment.v1
        caseEvents-in-0: # InquiryAnswered — 고객센터 답변
          destination: platform.case.v1
        slotEvents-in-0: # SlotCapacityReduced — 배송 지연 가능 안내(CP-1, 2026-11-16)
          destination: delivery.slot.v1
