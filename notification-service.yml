# notification-service 고유 설정(모든 프로필). 환경별 값은 notification-service-<프로필>.yml, 모든 서비스 공통은 application.yml. ADR-0029
# 옮긴 원본: pmart-backend services/.../application.yml (2026-11-02)
server:
  port: 8502
pmart:
  messaging:
    domain: platform
  notification:
    review-request: # 리뷰 요청 알림(2026-11-18 사용자 결정 "A해줘") — 둘 중 하나라도 없으면 보내지 않는다(CONFIG_REQUIRED). review-base-url 은 환경별
      delay: PT10M # 배송 완료 뒤 이만큼 지나면 리뷰를 썼는지 묻고, 안 썼으면 고객 알림함 + 휴대폰 푸시 한 번(2026-11-19 사용자 "레퍼런스처럼" — 레퍼런스 10-3-6 "배달완료 10분 후", 전에는 PT1H·알림함만)
      sweep-interval: PT1M # 위 기다림을 몇 분마다 보는지(기본 PT5M 이면 10~15분 뒤가 된다)
      max-age: P3D # 배송 완료 뒤 이만큼 지나도록 못 물었으면(review-service 장애) 포기
    push-token:
      max-devices: 5 # 단말 푸시 토큰(0.3.0, BR-09 — 2026-11-17): 고객·라이더 한 명이 둘 수 있는 단말 수. 넘으면 가장 오래 갱신되지 않은 단말을 지운다
    fcm:
      # 고객 휴대폰 푸시로도 보낼 알림 종류(ADR-0067, 2026-11-17 사용자 "응 해줘") — 나머지는 알림함만. 라이더는 전부(고르지 않음).
      # 서버 키는 환경별(notification-service-<프로필>.yml {cipher}) — 키가 없으면 이 목록이 있어도 보내지 않는다
      customer-templates:
        - PREPARATION_STARTED # 상품 준비 중(2026-11-19 레퍼런스 10-3-1, 사용자 "응 해줘")
        - DELIVERY_STARTED # 배송 출발
        - DELIVERY_HEADING # 주문하신 곳으로 가고 있어요(2026-11-19 레퍼런스 10-3-3 — 묶음 배달, PC 5 사건 DE-6)
        - DELIVERY_ARRIVING_SOON # 곧 도착(2026-11-19 레퍼런스 10-3-4 — 300m, PC 5 사건 TR-4)
        - REVIEW_REQUESTED # 리뷰 요청(2026-11-19 사용자 "레퍼런스처럼" — 10분 뒤 휴대폰에도)
        - DELIVERY_COMPLETED # 배송 완료
        - SHORTAGE_CANCELLED # 결품 부분 취소
        - ORDER_CANCELLED # 주문 취소
        - REFUND_SUCCEEDED # 환불 완료
        - DELIVERY_INCIDENT_RESHIPMENT # 사고·파손 재발송 안내(N-4, 2026-11-19)
        - DISPATCH_DELAYED # 배차 지연(2026-11-19 — 원문 §3.6, 사용자 "1,2,3 전부")
        - REFUND_DELAYED # 환불 늦어짐
        - REDELIVERY_PAYMENT_REQUIRED # 오배송 다시 배송비 결제 — 30분 안에 내야 해서(ADR-0065) 푸시도(사용자 2026-11-17 "넣고")
# 고객 알림함 구독(Spring Cloud Stream, ADR-0035 — 2026-11-16, 계약 0.2.0). 처음 켜기 전 소비 그룹 시작 위치 = latest(지난 주문에 알림을 몰아 쌓지 않게)
spring:
  cloud:
    function:
      definition: orderEvents;deliveryEvents;claimEvents;paymentEvents;caseEvents;slotEvents;riderEvents;trackingEvents
    stream:
      bindings:
        orderEvents-in-0: # 주문 확정·상품 준비 시작·취소·결품 부분 취소
          destination: order.order.v1
        deliveryEvents-in-0: # 배송 출발(PickupCompleted)·완료(DeliveryCompleted)
          destination: delivery.delivery.v1
        claimEvents-in-0: # RefundIntentCreated — 환불 결과를 주문과 잇는다
          destination: order.claim.v1
        paymentEvents-in-0: # RefundResult — 환불 성공·실패
          destination: order.payment.v1
        caseEvents-in-0: # InquiryAnswered — 고객센터 답변, RiderInquiryAnswered·CaseClosed(RIDER_HELP) — 라이더 알림함(0.4.0)
          destination: platform.case.v1
        slotEvents-in-0: # SlotCapacityReduced — 배송 지연 가능 안내(CP-1, 2026-11-16)
          destination: delivery.slot.v1
        riderEvents-in-0: # RiderRestricted — 라이더 계정 제한·해제 알림(0.4.0, 2026-11-17 §11-5). 시작 위치 latest(application-lan.yml)
          destination: delivery.rider.v1
        trackingEvents-in-0: # DeliveryReceiptCheckRequested — 고객에게 받았는지 묻기(2026-11-17, #153). 시작 위치 latest
          destination: delivery.tracking.v1
