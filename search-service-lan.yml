# search-service lan 프로필 — LAN 공유 개발 환경. 비밀값은 {cipher}(암호화: ./gradlew :platform-services:config-server:configCipher). ADR-0029
pmart:
  search:
    # 상품 검색(Elasticsearch 8.18 + nori, ADR-0031). 상품 색인은 조회만 — 색인은 Logstash 가 도메인 이벤트로 한다(최근 검색어·검색 기록 색인은 이 서비스가 쓴다, 2026-11-17).
    # 별칭 products → products-v5(2026-11-05 재색인, REINDEX.md), sku-prices → sku-prices-v1, sku-handlings → sku-handlings-v1
    elasticsearch-url: 'http://es-search:9200' # 검색 전용 ES(ADR-0038, pc3)
    # 검색 결과의 카테고리 이름 경로(공개 트리, 5분 사본). 취급 여부는 색인 carriedMfcIds(2026-11-05 — 가용 조회 주소 삭제)
    product-base-url: http://product-service:8101
    # 검색자 해시(HMAC-SHA256) 비밀키 — 최근 검색어·인기 키워드 기록(2026-11-17). 원본 deploy/lan/.secrets/search-searcher-hash-key(git 제외)
    searcher-hash-key: '{cipher}b9d7184cd27555f9f5c7a1b09388626faa60e6e96581fc18ab3c52ffb24eddbe2056eec63818eafc5c5aa64438b24056aecd96fe16e02e06f34cdf701200f5c941e228a01658f64ac20c75e101786265929c7c69ad74845fce71a70c5dae9d6b'
    # 오타 교정(ADR-0073 단계 A, 2026-11-20): 결과가 이 수 이하이면 고친 검색어가 더 많이 찾을 때만 suggestedQuery. 없으면 교정 꺼짐(0건 자동 교정 포함)
    correction:
      few-results: 3
