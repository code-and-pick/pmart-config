# eureka-server lan 프로필. 단일 노드(등록·조회 끔)라 복제 대상이 없다.
# application-lan.yml 의 defaultZone(사용자·비밀번호 포함)을 그대로 받으면 PeerEurekaNodes 가 그 주소를 로그에 찍는다(2026-11-03) —
# 인증 정보 없는 자기 주소로 덮어쓴다.
eureka:
  instance:
    hostname: eureka-server
  client:
    service-url:
      defaultZone: 'http://localhost:8761/eureka/'
