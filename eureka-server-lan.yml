# eureka-server lan 프로필. 단일 노드(등록·조회 끔)라 복제 대상이 없다.
# application-lan.yml 의 defaultZone(사용자·비밀번호 포함)을 그대로 받으면 PeerEurekaNodes 가 그 주소를 로그에 찍는다(2026-11-03) —
# 인증 정보 없는 자기 주소로 덮어쓴다.
eureka:
  instance:
    hostname: eureka-server
  client:
    service-url:
      defaultZone: 'http://localhost:8761/eureka/'
  server:
    # 위 주소가 자기 자신임을 알린다(2026-11-11). 없으면 인스턴스 이름(prefer-ip-address → PC IP)과 localhost 가 달라 남으로 보고
    # 모든 등록·갱신을 localhost 로 복제하다 401(인증 정보 없음)로 버린다 — 10분에 로그 약 1,300줄(CPU 와는 상관없었다 — 고친 뒤에도 같음).
    # SingleNodePeersIT 가 확인한다. defaultZone 을 바꾸면 이것도 같이 바꾼다
    my-url: 'http://localhost:8761/eureka/'
