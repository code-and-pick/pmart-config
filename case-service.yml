# case-service 고유 설정(모든 프로필). 환경별 값은 case-service-<프로필>.yml, 모든 서비스 공통은 application.yml. ADR-0029
# 옮긴 원본: pmart-backend services/.../application.yml (2026-11-02)
server:
  port: 8506
pmart:
  messaging:
    domain: platform
  # 사건함 처리 기한(2026-11-16 사건함 공통 결정 — 표시만, 알림 없음). 값 확정(사용자 2026-11-16 "그대로 할게"). 없으면 CaseRules.DEFAULT_SLA
  cases:
    sla:
      "[RIDER_HELP]": PT10M # 맵 키의 _ 를 지키려고 [ ] (Spring 맵 바인딩)
      "[DELIVERY_INCIDENT]": PT30M
      "[RIDER_LOCATION_STALE]": PT10M
      "[MISDELIVERY]": PT30M
      "[DISPATCH_FAILED]": PT10M # 배차 실패(사용자 2026-11-16 "1번으로")
      "[RECONCILIATION]": PT1H # 사가·결제 이상(R-3, 사용자 2026-11-16 "한시간으로")
      "[PAYMENT_UNKNOWN]": PT1H
spring:
  servlet:
    multipart: # 문의 사진(0.14.0) — 1장 상한은 InquiryRules.MAX_PHOTO_BYTES(10MB), 넘으면 422 PHOTO_INVALID 로 답하려고 조금 크게
      max-file-size: 11MB
      max-request-size: 12MB
  # 사건함 구독(Spring Cloud Stream, ADR-0035 — 2026-11-16). 처음 켜기 전 소비 그룹 시작 위치 = latest
  cloud:
    function:
      definition: deliveryEvents;trackingEvents;sagaEvents;paymentEvents;claimEvents
    stream:
      bindings:
        deliveryEvents-in-0: # delivery-execution DeliveryIncidentRaised → 라이더 도움요청·전달 실패 사건(R-4), delivery-dispatch DispatchFailed → 배차 실패 사건
          destination: delivery.delivery.v1
        trackingEvents-in-0: # delivery-tracking RiderLocationStale → 위치 끊김 사건(R-6)
          destination: delivery.tracking.v1
        sagaEvents-in-0: # order-orchestration ReconciliationRequired·CompensationExecuted(실패·불명만) → 사가·결제 이상(R-3)
          destination: order.saga.v1
        paymentEvents-in-0: # payment PaymentMismatch·PaymentResultUnknown(상신만) → 사가·결제 이상(R-3)
          destination: order.payment.v1
        claimEvents-in-0: # claim ReturnRecoveryFailed → 반품 회수 실패 사건(R-8, 2026-11-17)
          destination: order.claim.v1
