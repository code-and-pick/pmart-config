# auth-service lan 프로필 — LAN 공유 개발 환경. 비밀값은 {cipher}(암호화: ./gradlew :platform-services:config-server:configCipher). ADR-0029
spring:
  datasource:
    url: 'jdbc:postgresql://postgres-pc4:15432/auth_service'
    username: 'pmart'
    password: '{cipher}29eb4261f88151e247af86806e860a904c44358f8aa451229e5c6661766a668aa2ca9a5a94475f10d8e101b46b97e59bdcf5ae825a69c15c63c67bbb74d9fbff7e7ae41afa56c0045558aec968b87ef1'
pmart:
  auth:
    # [LAN 시험 전용] 개발용 고객 토큰(2026-11-19 MFC 시뮬레이터 R-21 — 사용자 "제안대로해줘"). 운영(prod) 설정에는 두지 않는다 → 경로 404.
    # POST http://<auth PC>:8501/api/v1/internal/dev-customer-tokens {accountId} — 게이트웨이에 없음. 허용 목록 밖 403, 토큰 15분(세션 행이 발급 기록)
    dev-customer-token:
      enabled: true
      ttl: PT15M
      allowed-accounts:
        - CU-eae131fa-886a-4733-9eee-86a158be281a # PC 1 지정 고객 = 사용자 Google 계정(2026-11-19) — 실제 주문·알림이 그 앱으로 간다
    issuer: 'http://auth-service:8501'
    # 서명키(PKCS#8 PEM 본문, 첫 키가 활성) — 비밀값은 {cipher}. 운영자 로그인·첫 관리자·개발 계정은 2026-11-13 없앴다(ADR-0056 7단계 — 직원은 employee-auth-service)
    signing:
      keys:
        - kid: 'lan-20261024'
          private-key: '{cipher}'
    customer:
      customer-service-base-url: http://customer-service:8103 # 필수 동의 판단·반영(GET/POST /internal/accounts/{id}/consents·consent-changes, CU-1)
      google:
        # 허용할 ID 토큰 aud = 고객용 Google "웹 애플리케이션" 클라이언트 ID 하나(고객 앱 serverClientId, ADR-0055). 비면 Google 로그인은 CONFIG_REQUIRED.
        # Android 클라이언트 ID 는 넣지 않는다 — Google 이 패키지·SHA-1 로 앱을 알아보는 데만 쓰고 ID 토큰 aud 는 늘 serverClientId 다
        # (2026-11-10 293585219605-29edshi9… 를 뺌: 고객 앱 serverClientId 가 웹 ID 라 이 값을 aud 로 가진 토큰은 없음)
        client-ids: '293585219605-p6akml03k4lpi01agvgah41g2imo1aes.apps.googleusercontent.com'

      # 카카오·네이버 로그인(2026-11-19 ADR-0071, auth 0.4.0) — 허용 ID 토큰 aud. 공개 값(앱에도 들어감). 원본: 고객 앱 apps/customer_app/.secrets/customer.env
      kakao:
        # 카카오 네이티브 앱 키(고객 앱 카카오 SDK 초기화 키 = ID 토큰 aud). 콘솔에서 OpenID Connect 켬
        client-ids: '4cb5da1f6f2a798ee135c072a8ebffe2'
      naver:
        # 네이버 애플리케이션 Client ID(= ID 토큰 aud, 서버 교환 client_id 는 첫 값). Client Secret 은 서버가 인가 코드를 교환할 때만(ADR-0078, 2026-11-20 BR-69)
        # 원본 deploy/lan/.secrets/naver-customer-client-secret.txt(고객 앱 customer.env 에서 옮김) — 앱·로그 금지
        client-ids: 'GKQjIobmiGjOTQDdCcIV'
        client-secret: '{cipher}f4af43a74ff70d643b791beec0230924d4568005f31078161fecab0d1662b375'
        callback-url: 'http://192.168.0.40:8080/api/v1/auth/oauth-callbacks/naver/customer'
        # (A) LAN 시험용(2026-11-20 BR-74): true 면 로그인 교환마다 네이버 앱 연결을 끊어 매번 정보 제공 동의를 다시 받는다. 켜기 전에
        # 네이버 "연결된 서비스"에서 한 번 끊고 같은 계정으로 다시 로그인해 같은 PMart 계정(sub 유지)인지 먼저 확인. 운영에는 넣지 않는다
        unlink-after-exchange: false
