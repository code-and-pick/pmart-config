# hr-service local 프로필 — 개발자 PC(deploy/local docker compose, localhost). 로컬 전용 고정값. ADR-0029
# 로컬에는 Keycloak·메일 서버가 없다 — 등록·조회는 되고 계정 발급은 CONFIG_REQUIRED 로 남는다(재시도).
spring:
  datasource:
    url: jdbc:postgresql://localhost:15432/hr_service
    username: pmart
    password: pmart-local
pmart:
  hr:
    # 권한 요청 검사(2026-11-17 HR-2) — 역할 목록·지금 권한 내부 조회. LAN 은 기본값 http://employee-auth-service:8511.
    # employee-auth-service 가 떠 있지 않으면 요청 권한이 있는 등록·권한 요청은 503(검사 없이 받지 않는다)
    employee-auth-base-url: http://localhost:8511
