# rider-auth-service 고유 설정(모든 프로필). 환경별 값은 rider-auth-service-<프로필>.yml, 모든 서비스 공통은 application.yml. ADR-0029
# 라이더 Google 로그인·라이더 토큰 발급자(ADR-0054 E·F, ADR-0055). 발행 SubjectBlocked(platform.subject-block.v1 — 로그아웃·refresh 재사용 즉시 차단, 2026-11-13). 구독 없음.
server:
  port: 8510
pmart:
  messaging:
    domain: platform # 발행 토픽 platform.subject-block.v1
  security:
    # 자기 토큰(로그아웃·현재 세션)은 발급자 표의 rider 줄(이 서비스 JWKS)로 검증한다.
    # 공개키는 토큰 없이 접근. /internal 이라 게이트웨이로는 노출되지 않는다.
    permit-paths:
      - /actuator/health/**
      - /actuator/info
      - /actuator/prometheus
      - /error
      - /api/v1/internal/jwks
      # 계약 security: [] 작업(로그인·결과 조회·토큰 갱신). 경로마다 메서드가 하나뿐이라 경로 단위 허용이 계약과 일치.
      - /api/v1/rider-auth/social-logins
      - /api/v1/rider-auth/social-logins/*
      - /api/v1/rider-auth/tokens
  rider-auth:
    # 수치는 보안 설정값(2026-11-10 기본값 — 고객 로그인과 같은 제한 15분 5회 → 10분, 세션은 마지막 사용 기준 30일)
    access-token-ttl: PT30M
    refresh-token-ttl: P30D
    session-max-age: P30D
    failure-window: PT15M
    max-failures: 5
    restriction: PT10M
    google:
      # 허용할 ID 토큰 aud = 라이더용 Google "웹 애플리케이션" 클라이언트 ID(라이더 앱 serverClientId, ADR-0055).
      # Android 클라이언트 ID 는 넣지 않는다(패키지·SHA-1 로 앱을 알아볼 뿐 토큰 aud 가 아님). 공개 식별자라 비밀값이 아니다
      client-ids: '293585219605-la3cj13q19oo51p7e4d0rf4ickh3flgu.apps.googleusercontent.com'
