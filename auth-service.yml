# auth-service 고유 설정(모든 프로필). 환경별 값은 auth-service-<프로필>.yml, 모든 서비스 공통은 application.yml. ADR-0029
# 옮긴 원본: pmart-backend services/.../application.yml (2026-11-02)
server:
  port: 8501
pmart:
  messaging:
    domain: platform
  security:
    # JWT 검증은 자기 서명키로(KeyConfig 의 JwtDecoder) — jwk-set-uri 를 두지 않는다.
    # 공개키는 토큰 없이 접근. /internal 이라 게이트웨이로는 노출되지 않는다.
    permit-paths:
      - /actuator/health/**
      - /actuator/info
      - /actuator/prometheus
      - /error
      - /api/v1/internal/jwks
      - /api/v1/internal/dev-customer-tokens # [LAN 시험 전용] 개발용 고객 토큰(2026-11-19 R-21) — 켠 환경(auth-service-lan.yml)에만 경로가 있다, 게이트웨이엔 없음
      # 계약 security: [] 작업(로그인·토큰 발급). 경로마다 메서드가 하나뿐이라 경로 단위 허용이 계약과 일치.
      - /api/v1/auth/social-logins
      - /api/v1/auth/social-logins/*
      - /api/v1/auth/social-logins/*/completions
      - /api/v1/auth/tokens
      - /api/v1/auth/guest-sessions
      - /api/v1/auth/oauth-callbacks/naver/* # 네이버 로그인 콜백 중계(2026-11-19 BR-66, 0.5.0) — 앱 주소로 302 만
    # 비회원 토큰(typ=GUEST)이 쓸 수 있는 경로: 자기 세션 종료·조회(갱신 /auth/tokens 는 공개)
    guest-paths:
      - /api/v1/auth/logouts
      - /api/v1/auth/sessions/current
  auth:
    # 비회원 세션(typ=GUEST, 비회원 장바구니). 장바구니 보존 30일에 맞춘 보안 설정값
    guest:
      access-token-ttl: PT1H
      refresh-token-ttl: P30D
      session-max-age: P30D
    # 고객 소셜 로그인(D6: Google 먼저, 2026-10-30). 수명·제한 수치는 보안 설정값(제한은 Commerce 4.9: 15분 5회 → 10분)
    customer:
      access-token-ttl: PT30M
      refresh-token-ttl: P30D
      session-max-age: P30D # 마지막 사용(토큰 갱신) 기준 연장 — 30일 안 쓰면 재로그인(2026-11-02)
      # 필수 약관 동의 단계(AUTH_CONSENT, 서버는 2026-11-17 CU-1 로 준비됨). 켜면 신규 가입과 필수 약관 현행 버전에 동의하지 않은 기존 회원은
      # 동의 화면을 거친다(판단은 customer-service — customer-service-base-url). 고객앱 동의 흐름 반영 뒤 true — CU-1 2026-11-17.
      # 켤 때는 customer-service.yml consents.purchase-gate 와 함께 true
      require-consent: true # 2026-11-19 사용자 "켜줘"(CU-1) — purchase-gate 와 함께
      failure-window: PT15M
      max-failures: 5
      restriction: PT10M
