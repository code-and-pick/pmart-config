# ai-assistant-service lan 프로필 — LAN 공유 개발 환경(ADR-0051: 운영자용 RAG, pc2). 비밀값은 {cipher}(./gradlew :platform-services:config-server:configCipher). ADR-0029
spring:
  datasource:
    # RAG 전용 pgvector(같은 PC, LAN 미공개) — 서비스 계정 ai_assistant_service 는 이 DB 에만 접속(고객용 DB 는 권한 없음)
    url: 'jdbc:postgresql://rag-pgvector:15433/ai_assistant_service'
    username: 'ai_assistant_service'
    password: '{cipher}188a8b48510349d7322f88f2145b1dc8fe338bfc46b2d82635c318646f902e2d6c15834745e8618f5b78f879655944d3b357c908f94456e4660ea7b8d6d77632e0b0f0968607306a5eb7ed18055f00b3'
pmart:
  assistant:
    model:
      provider: ollama # LAN Ollama(같은 PC, GPU) — 외부 유료 API 없음(ADR-0051 결정 6)
      embedding-dim: 1024
      ollama:
        base-url: http://ollama:11434
        embedding-model: qwen3-embedding:0.6b # 2026-11-09 비교 평가로 결정(D3) — docs/rag/verification/2026-11-09/embedding-compare
        embedding-version: ac6da0dfba84 # ollama list 의 ID. 모델 파일을 바꾸면 바꾸고 재색인(lan.sh rag-ingest)
        embedding-num-gpu: 0 # 임베딩은 CPU — GPU(6GB)는 대화 모델(8192 문맥 3.9GB)에. 함께 올리면 서로 밀어냄(2026-11-09)
        embedding-num-ctx: 2048
        query-instruction: "Instruct: Given a question about company policy or operating procedures, retrieve the document passages that answer it\nQuery: "
        chat-model: qwen3:8b # 시험(2026-11-09) — 4B 와 같은 30문항으로 비교 중. 4B 로 되돌릴 수 있음
        chat-temperature: 0.2
        chat-num-ctx: 8192
        disable-thinking: true
        keep-alive: 24h
        request-timeout: 25s # 처리 하드 타임아웃(60s) 안 — 재생성 1회 포함
    retrieval:
      # 근거 없음 임계값(혼합 유사도) — 의미 임베딩용. 0.18 은 해시 기준선 값이라 거의 모든 질문이 넘었다(답변 평가 A20 지어낸 답).
      # 2026-11-09 맞추기: 답 있는 질문 최저 1위 0.426, 답 없는 질문 최고 0.407 → 0.40(답 있는 19 모두 통과, 답 없는 9 중 7 걸러짐).
      # docs/rag/verification/2026-11-09/answer-eval/threshold-calibration.md
      threshold: 0.40
