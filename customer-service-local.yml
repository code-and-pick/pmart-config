# customer-service local 프로필 — 개발자 PC(deploy/local docker compose, localhost). 로컬 전용 고정값. ADR-0029
spring:
  datasource:
    url: jdbc:postgresql://localhost:15432/customer_service
    username: pmart
    password: pmart-local
pmart:
  storage:
    s3:
      # deploy/local 의 s3(SeaweedFS). 버킷은 compose 가 -bucket= 으로 만든다. 로컬 전용 기본 자격 증명(product-content 와 같음).
      endpoint: http://localhost:8333
      bucket: pmart-customer
      access-key: pmart-local-s3
      secret-key: pmart-local-s3-secret
      region: us-east-1
      path-style: true
      create-bucket: false
  customer:
    serviceability-base-url: http://delivery-serviceability-service:8401
