# mfc-capacity-service local 프로필 — 개발자 PC(deploy/local docker compose, localhost). 로컬 전용 고정값. ADR-0029
spring:
  datasource:
    url: jdbc:postgresql://localhost:15432/mfc_capacity_service
    username: pmart
    password: pmart-local
pmart:
  capacity:
    units-per-hour: 30
    expiry-interval: PT30S # TTL 지난 HELD 정리 주기
    receiving: # 오전 입고 수령창·하차면(2026-11-08). 규모 설계 가정 — 승인 전 시험값(입고량 134/293 vs 154/337 미정). 비우면 CONFIG_REQUIRED
      window-start: '07:00' # Asia/Seoul
      window-end: '10:00'
      max-load-units-per-arrival: 150 # 1회 입고 상한(박스 환산) — 가정값
      total-load-units: 300 # 하루 창 전체 — 가정값
      bay-count: 2 # 하차면 수 — 가정값
    plan: # 배정 추천(WK-09, 2026-11-08). 미설정이면 계산 거절(CONFIG_REQUIRED)
      mfc-fulfillment-base-url: http://localhost:8302 # READY·ASSIGNED·IN_PROGRESS 작업 목록 동기 조회
      task-minutes: # 작업 유형 → 예상 분. 규모 설계 가정(피킹 7·패킹 4) — 승인 전 시험값
        PICK: 7
        PACK: 4
      time-limit: PT5S # CP-SAT 시간 제한(게이트웨이 10초보다 짧게)
      packing-stations: 4 # 동시 PACK 상한(규모 설계 기본 4대)
      weights: # 목적 가중치 — 임시 구현값(Q-08 전, 운영 정책 아님). 필수 조건은 가중치가 아니라 제약
        UNASSIGNED: 1000000
        LATE: 1000
        MAX_LOAD: 10
