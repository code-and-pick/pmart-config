# mfc-capacity-service local 프로필 — 개발자 PC(deploy/local docker compose, localhost). 로컬 전용 고정값. ADR-0029
spring:
  datasource:
    url: jdbc:postgresql://localhost:15432/mfc_capacity_service
    username: pmart
    password: pmart-local
pmart:
  capacity:
    units-per-hour: 45 # 사용자 결정(2026-11-08): 포장대 4대 × 11.25건/시간
    expiry-interval: PT30S # TTL 지난 HELD 정리 주기
    receiving: # 오전 입고 수령창·하차면 — 사용자 확정 시작값(2026-11-08). 비우면 CONFIG_REQUIRED
      window-start: '07:00' # Asia/Seoul, 원문 오전 검수 3시간
      window-end: '10:00'
      max-load-units-per-arrival: 360 # 1회 상한 = 원문 물리 상한 9팔레트(검수장 22평)
      total-load-units: 720 # 하루 상한 = 오전 차량 2대(원문 543행 확정 조건 "2대 이상") × 1회 상한 — 2026-11-08 정정
      bay-count: 1 # 검수장 하나 — 차는 순서대로 받음(동시 하차 1대)
    plan: # 배정 추천(WK-09, 2026-11-08). 미설정이면 계산 거절(CONFIG_REQUIRED)
      mfc-fulfillment-base-url: http://localhost:8302 # READY·ASSIGNED·IN_PROGRESS 작업 목록 동기 조회
      task-minutes: # 작업 유형 → 예상 분. 원문 7장 피킹 7·패킹 4 — 사용자 확정 시작값(2026-11-08), 실측 뒤 조정
        PICK: 7
        PACK: 4
      time-limit: PT5S # CP-SAT 시간 제한(게이트웨이 10초보다 짧게)
      packing-stations: 4 # 동시 PACK 상한 — 원문 기준안 기본 가동 4대, 사용자 확정 시작값(2026-11-08)
      weights: # 목적 가중치 — 임시 구현값(Q-08 전, 운영 정책 아님). 필수 조건은 가중치가 아니라 제약
        UNASSIGNED: 1000000
        LATE: 1000
        MAX_LOAD: 10
