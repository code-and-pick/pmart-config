# mfc-capacity-service local 프로필 — 개발자 PC(deploy/local docker compose, localhost). 로컬 전용 고정값. ADR-0029
spring:
  datasource:
    url: jdbc:postgresql://localhost:15432/mfc_capacity_service
    username: pmart
    password: pmart-local
pmart:
  capacity:
    units-per-hour: 45 # 사용자 결정(2026-11-08): 포장대 4대 × 11.25건/시간
    expiry-interval: PT30S # TTL 지난 HELD 정리 주기
    receiving: # 오전 입고 수령창·하차면 — 사용자 확정 시작값(2026-11-08). 비우면 CONFIG_REQUIRED
      window-start: '07:00' # Asia/Seoul, 원문 오전 검수 3시간
      window-end: '10:00'
      max-load-units-per-arrival: 360 # 1회 상한 = 원문 물리 상한 9팔레트(검수장 22평)
      total-load-units: 720 # 하루 상한 = 오전 차량 2대(원문 543행 확정 조건 "2대 이상") × 1회 상한 — 2026-11-08 정정
      bay-count: 1 # 검수장 하나 — 차는 순서대로 받음(동시 하차 1대)
    plan: # 배정 추천(WK-09, 2026-11-08). 미설정이면 계산 거절(CONFIG_REQUIRED)
      mfc-fulfillment-base-url: http://localhost:8302 # READY·ASSIGNED·IN_PROGRESS 작업 목록 동기 조회
      mfc-inbound-base-url: http://localhost:8306 # 다음 작업 받기 — 이동·보충 지시 조회(작업자 쪽 4단계, 2026-11-08)
      center-master-base-url: http://localhost:8507 # 직원 근무 시간표(STAFF) — 근무 미등록 작업자의 근무(사용자 2026-11-09 풀타임 = 센터 운영시간). 없으면 다음 작업 받기·배정 추천 CONFIG_REQUIRED
      mfc-location-base-url: http://localhost:8304 # 칸 사이 거리표(피킹 방문 순서, ADR-0050 B2, 2026-11-09)
      pick-route-start: CRT-A-01 # 피킹 출발점 = 장바구니 보관 자리(사용자 2026-11-09). 없으면 순서 계산 CONFIG_REQUIRED → fulfillment 는 칸 코드 순
      travel: # 작업 시간 추정(0.11.0, 사용자 2026-11-09) — 임시 구현값(시뮬레이터 config.ts 값). PICK·PACK 은 유형 분을 평균으로 비율, 이동·보충·복귀는 걷는 시간+처리
        walk-speed-mps: 1.1 # 장바구니를 밀며 걷는 속도
        scan-sec-per-line: 9 # 줄마다 위치·상품 스캔
        sec-per-unit: 3 # 개수마다 집기
        pack-location: PAK-A-01 # 피킹 끝(포장 위치)
      task-minutes: # 작업 유형 → 예상 분. 원문 7장 피킹 7·패킹 4 — 사용자 확정 시작값(2026-11-08), 실측 뒤 조정
        PICK: 7
        PACK: 4
        RETURN: 5 # 임시 구현값(2026-11-08) — fulfillment 늦음 표시의 RETURN PT5M 과 같게, 실측 뒤 조정
        REPLENISH: 5 # 임시 구현값 — 이동·보충 배정 추천(작업자 쪽), 원문에 기준 없음
        MOVE: 5 # 임시 구현값 — 위와 같음
        QUARANTINE_MOVE: 5 # 임시 구현값(2026-11-20 #286 MC-2) — MOVE 와 같게, 실측 뒤 조정
      time-limit: PT5S # CP-SAT 시간 제한(게이트웨이 10초보다 짧게)
      input-max-bytes: 2147483648 # 계산 입력 저장 총량 상한 2GB(사용자 결정 2026-11-09, 기간 없음) — 넘으면 오래된 것부터(확정 안 된 계획 먼저)
      packing-stations: 4 # 동시 PACK 상한 — 원문 기준안 기본 가동 4대, 사용자 확정 시작값(2026-11-08)
      weights: # 목적 순서 — 사용자 결정 Q-08(2026-11-08): 원문 1061행 순서 미배정 → 지연 → (이동시간: 지도 Q-03 뒤) → 편중. 숫자는 그 순서를 보장하는 크기. 필수 조건은 가중치가 아니라 제약. 자동 확정 없음(감독자 확정)
        UNASSIGNED: 1000000
        LATE: 1000
        MAX_LOAD: 10
