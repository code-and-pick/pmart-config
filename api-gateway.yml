# api-gateway 고유 설정(모든 프로필). 환경별 값은 api-gateway-<프로필>.yml, 모든 서비스 공통은 application.yml. ADR-0029
# 옮긴 원본: pmart-backend services/.../application.yml (2026-11-02)
# api-gateway 설정. 라우팅 표는 contracts/openapi/*.yaml 의 servers.url + 첫 경로 세그먼트에서 도출했다(2026-10-23).
# - /api/v1/internal/** 은 서비스 간 전용이라 라우팅·인가 모두 거부한다(서비스 토큰은 Service DNS 로 직접 호출).
# - 같은 세그먼트를 여러 서비스가 쓰는 me / riders / deliveries 는 더 구체적인 경로를 음수 order 로 먼저 매칭한다.
# - 업스트림 주소는 pmart.gateway.upstream.<service> (기본: Kubernetes Service DNS). 환경별 주소는 api-gateway-<프로필>.yml 에서 덮어쓴다(설정 서버 값이 환경변수보다 우선).
# - 공개 경로(pmart.gateway.public-paths)는 계약에서 security: [] 인 작업만. 그 외 모든 /api/** 는 JWT 필수.
# - 처리율 제한(pmart.gateway.rate-limit): JWT subject / 클라이언트 IP 단위 Redis 토큰 버킷. Redis 장애 시 허용(fail-open).
spring:
  reactor:
    # WebFlux 는 요청 하나가 여러 스레드를 오간다. 현재 span(traceId)을 Reactor Context → ThreadLocal 로 옮겨야
    # 보안 오류 응답(ProblemResponseWriter: Tracer.currentSpan())·로그 MDC 에 traceId 가 보인다(2026-11-03 LAN 에서 빠져 있었음)
    context-propagation: auto
  webflux:
    problemdetails:
      enabled: true # 404(라우트 없음) 등 WebFlux 자체 오류도 RFC 9457
  cloud:
    # 주체 차단 사건(ADR-0054 ⑤) — SubjectBlocked(auth 등) → 게이트웨이 Redis 차단 목록. 함수 subjectBlocks(SubjectBlockEvents).
    # 게이트웨이는 DB 가 없어 common-messaging 기본값(inbox·dead_letter)이 없다 → 그룹·재시도·DLT 를 여기 적는다. 쓰기는 멱등(늦은 차단 시각만 남김).
    # Bus(lan)는 busConsumer 를 이 뒤에 붙인다. 바꾸면 재시작한다. 단위 시험은 definition 을 비우고 enabled=false.
    function:
      definition: subjectBlocks
    stream:
      bindings:
        subjectBlocks-in-0:
          destination: platform.subject-block.v1
          group: api-gateway # 게이트웨이가 여러 대여도 Redis 를 같이 쓰므로 한 대만 받으면 된다
          consumer:
            max-attempts: 4
            back-off-initial-interval: 1000
            back-off-multiplier: 2.0
            back-off-max-interval: 10000
            retryable-exceptions:
              java.lang.IllegalArgumentException: false # 계약에 어긋난 사건 — 바로 DLT
      kafka:
        bindings:
          subjectBlocks-in-0:
            consumer:
              enable-dlq: true
              dlq-name: platform.subject-block.v1.DLT
              ack-mode: RECORD
              configuration:
                auto.offset.reset: earliest # 처음 붙을 때 남아 있는 차단도 받는다(지난 차단은 남길 기간 0 이라 쓰지 않음)
                isolation.level: read_committed
                key.deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
                value.deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 1000 # ms
            response-timeout: 10s
          # 업스트림으로 가는 Cookie 헤더는 CookieStripGlobalFilter 가 지운다(예전 default-filters RemoveRequestHeader=Cookie).
          # 라우트 metadata pmart-keep-cookies: true 인 라우트(Keycloak 로그인 화면 /iam)만 예외 — Keycloak 로그인은 쿠키로 이어진다
          routes:
            # 직원 로그인 화면(ADR-0056 결정 11) — Keycloak 의 pmart-staff 로그인에 필요한 경로만 중계한다.
            # 관리 콘솔·Admin API(/iam/admin/**)·master Realm(/iam/realms/master/**)·계정 화면 등 그 밖의 /iam 은 라우트가 없어 404
            - id: keycloak-iam
              uri: ${pmart.gateway.upstream.keycloak}
              predicates:
                - Path=/iam/realms/pmart-staff/protocol/openid-connect/**,/iam/realms/pmart-staff/login-actions/**,/iam/realms/pmart-staff/.well-known/**,/iam/resources/**
              filters:
                - StripPrefix=1
              metadata:
                pmart-keep-cookies: true
            # 웹 백오피스 refresh 쿠키 갱신(ADR-0059) — employee-auth-service 쿠키(__Secure-pmart_ea_*)만 넘기고 나머지 쿠키는 지운다.
            # 일반 employee-auth-service 라우트보다 먼저(order)
            - id: employee-auth-refresh-cookie
              uri: ${pmart.gateway.upstream.employee-auth-service}
              predicates:
                - Path=/api/v1/employee-auth/tokens/refresh/*
              order: -100
              metadata:
                pmart-keep-cookie-prefixes: __Secure-pmart_ea_
            - id: search-service-me
              uri: ${pmart.gateway.upstream.search-service}
              predicates:
                - Path=/api/v1/me/recent-searches/**
              order: -100
            - id: notification-service-me
              uri: ${pmart.gateway.upstream.notification-service}
              predicates:
                - Path=/api/v1/me/notifications/**,/api/v1/me/notification-settings,/api/v1/me/notification-setting-changes/**
              order: -99
            - id: customer-service-me
              uri: ${pmart.gateway.upstream.customer-service}
              predicates:
                - Path=/api/v1/me,/api/v1/me/**
              order: -98
            - id: delivery-tracking-service-rider
              uri: ${pmart.gateway.upstream.delivery-tracking-service}
              predicates:
                - Path=/api/v1/riders/me/locations/**,/api/v1/deliveries/*/eta,/api/v1/deliveries/*/stream
              order: -97
            - id: delivery-execution-service-rider
              uri: ${pmart.gateway.upstream.delivery-execution-service}
              predicates:
                - Path=/api/v1/riders/me/deliveries,/api/v1/riders/me/earnings
              order: -96
            - id: delivery-dispatch-service-deliveries
              uri: ${pmart.gateway.upstream.delivery-dispatch-service}
              predicates:
                - Path=/api/v1/deliveries/*/dispatch,/api/v1/deliveries/*/assignment-cancellations/**
              order: -95
            - id: delivery-execution-service-deliveries
              uri: ${pmart.gateway.upstream.delivery-execution-service}
              predicates:
                - Path=/api/v1/deliveries/**
              order: -94
            - id: rider-service-riders
              uri: ${pmart.gateway.upstream.rider-service}
              predicates:
                - Path=/api/v1/riders/**
              order: -93
            - id: product-service
              uri: ${pmart.gateway.upstream.product-service}
              predicates:
                - Path=/api/v1/products/**,/api/v1/skus/**,/api/v1/sku-issuances/**,/api/v1/categories/**,/api/v1/barcodes/**,/api/v1/product-drafts/**,/api/v1/product-import-batches/**,/api/v1/category-tree-versions/**,/api/v1/category-tree-additions,/api/v1/category-tree-addition-uploads
            - id: product-content-service
              uri: ${pmart.gateway.upstream.product-content-service}
              predicates:
                - Path=/api/v1/product-contents/**,/api/v1/content-drafts/**,/api/v1/content-import-batches/**,/api/v1/content-images/**
            - id: customer-service
              uri: ${pmart.gateway.upstream.customer-service}
              predicates:
                - Path=/api/v1/guest-delivery-addresses/**
            - id: cart-service
              uri: ${pmart.gateway.upstream.cart-service}
              predicates:
                - Path=/api/v1/carts/**
            - id: search-service
              uri: ${pmart.gateway.upstream.search-service}
              predicates:
                - Path=/api/v1/search/**
            - id: storefront-service
              uri: ${pmart.gateway.upstream.storefront-service}
              predicates:
                - Path=/api/v1/storefront/**
            - id: pricing-service
              uri: ${pmart.gateway.upstream.pricing-service}
              predicates:
                - Path=/api/v1/prices/**,/api/v1/price-versions/**,/api/v1/price-version-applications/**,/api/v1/price-import-batches/**
            - id: order-service
              uri: ${pmart.gateway.upstream.order-service}
              predicates:
                - Path=/api/v1/order-drafts/**,/api/v1/orders/**,/api/v1/delivery-options,/api/v1/fulfillment-issues,/api/v1/fulfillment-issues/**
            - id: claim-service
              uri: ${pmart.gateway.upstream.claim-service}
              predicates:
                - Path=/api/v1/claims/**
            - id: payment-service
              uri: ${pmart.gateway.upstream.payment-service}
              predicates:
                - Path=/api/v1/webhooks/**,/api/v1/payments/**,/api/v1/payment-confirmations/**,/api/v1/payment-authorization-failures/**,/api/v1/payment-widget-config/**
            - id: mfc-inventory-service-sku-handlings
              uri: ${pmart.gateway.upstream.mfc-inventory-service}
              predicates:
                - Path=/api/v1/mfcs/*/sku-handlings/**,/api/v1/mfcs/*/sku-handling-batches/**,/api/v1/mfcs/*/stock,/api/v1/mfcs/*/stock-corrections,/api/v1/mfcs/*/count-sessions/**,/api/v1/mfcs/*/unshippable-lots,/api/v1/mfcs/*/replenishment-policies # 보충 기준(IV-04) · 순환 실사(IV-11)·출하 부적격 LOT 회수 목록(2026-11-08)
              order: -90
            - id: cdc-inventory-service-sku-handlings
              uri: ${pmart.gateway.upstream.cdc-inventory-service}
              predicates:
                - Path=/api/v1/cdcs/*/sku-handlings/**,/api/v1/cdcs/*/sku-handling-batches/**
              order: -89
            - id: mfc-fulfillment-service
              uri: ${pmart.gateway.upstream.mfc-fulfillment-service}
              predicates:
                - Path=/api/v1/tasks/**,/api/v1/shipments/**,/api/v1/packages/**
            - id: mfc-capacity-service
              uri: ${pmart.gateway.upstream.mfc-capacity-service}
              predicates:
                - Path=/api/v1/assignments/**,/api/v1/assignment-plans/**,/api/v1/operation-restrictions/**,/api/v1/mfcs/*/workers,/api/v1/mfcs/*/workers/** # 작업자·업무·근무(WK-02, 2026-11-08)
            - id: mfc-location-service
              uri: ${pmart.gateway.upstream.mfc-location-service}
              predicates:
                - Path=/api/v1/locations/**,/api/v1/putaway-candidates/**
            - id: mfc-quality-service
              uri: ${pmart.gateway.upstream.mfc-quality-service}
              predicates:
                - Path=/api/v1/quality-decisions/**,/api/v1/return-inspections,/api/v1/return-inspections/**,/api/v1/disposal-approvals/**,/api/v1/quality-incidents/**
            - id: mfc-inbound-service
              uri: ${pmart.gateway.upstream.mfc-inbound-service}
              predicates:
                - Path=/api/v1/inbound-promises/**,/api/v1/supply-requests/**,/api/v1/return-receipts,/api/v1/return-receipts/**,/api/v1/initial-stock-loads,/api/v1/initial-stock-loads/**,/api/v1/inbound-tasks,/api/v1/inbound-tasks/**,/api/v1/move-orders,/api/v1/move-orders/** # 재고 이동 지시(IV-03, 2026-11-08)
            - id: delivery-serviceability-service
              uri: ${pmart.gateway.upstream.delivery-serviceability-service}
              predicates:
                - Path=/api/v1/serviceability-checks/**,/api/v1/delivery-conditions/**,/api/v1/serviceability-versions/**,/api/v1/address-geocodes,/api/v1/address-reverse-geocodes
            - id: delivery-capacity-service
              uri: ${pmart.gateway.upstream.delivery-capacity-service}
              predicates:
                - Path=/api/v1/slots/**
            - id: delivery-dispatch-service
              uri: ${pmart.gateway.upstream.delivery-dispatch-service}
              predicates:
                - Path=/api/v1/dispatch-requests/**,/api/v1/offers/**
            - id: auth-service
              uri: ${pmart.gateway.upstream.auth-service}
              predicates:
                - Path=/api/v1/auth/**
            - id: rider-auth-service # 라이더 Google 로그인·라이더 토큰(ADR-0054 E)
              uri: ${pmart.gateway.upstream.rider-auth-service}
              predicates:
                - Path=/api/v1/rider-auth/**
            - id: employee-auth-service # 직원 로그인(Keycloak 기밀 클라이언트)·직원 토큰(ADR-0056)
              uri: ${pmart.gateway.upstream.employee-auth-service}
              predicates:
                - Path=/api/v1/employee-auth/**
            - id: hr-service # 직원 등록·인사 정보·계정 발급(ADR-0056)
              uri: ${pmart.gateway.upstream.hr-service}
              predicates:
                - Path=/api/v1/hr/**
            - id: audit-service
              uri: ${pmart.gateway.upstream.audit-service}
              predicates:
                - Path=/api/v1/audit-entries/**
            - id: backoffice-bff
              uri: ${pmart.gateway.upstream.backoffice-bff}
              predicates:
                - Path=/api/v1/backoffice/views/**,/api/v1/backoffice/commands/**
            - id: approval-service
              uri: ${pmart.gateway.upstream.approval-service}
              predicates:
                - Path=/api/v1/change-requests/**,/api/v1/approvals/**,/api/v1/batch-changes/**,/api/v1/policy-references/**
            - id: case-service
              uri: ${pmart.gateway.upstream.case-service}
              predicates:
                - Path=/api/v1/cases/**,/api/v1/obligations/**,/api/v1/cs-intakes/**,/api/v1/help-requests/**,/api/v1/shift-handovers/**,/api/v1/inquiries/**
            - id: center-master-service
              uri: ${pmart.gateway.upstream.center-master-service}
              predicates:
                - Path=/api/v1/centers/**
            - id: ai-assistant-service # 1차 RAG 앞당김(ADR-0036). 운영자만 — 서비스가 typ=OPERATOR 검사
              uri: ${pmart.gateway.upstream.ai-assistant-service}
              predicates:
                - Path=/api/v1/assistant/**
              metadata:
                # 모델 생성(재생성 1회 포함)이 10초를 넘을 수 있다 — 서비스 처리 하드 타임아웃 60s 보다 길게(2026-11-09 답변 평가 N08 504). ms
                response-timeout: 65000
            - id: customer-assistant-service # 고객앱 RAG(ADR-0051). 회원 고객만 — 서비스가 typ=CUSTOMER 검사(비회원 403, C2)
              uri: ${pmart.gateway.upstream.customer-assistant-service}
              predicates:
                - Path=/api/v1/customer-assistant/**
              metadata:
                response-timeout: 65000 # 모델 생성 — 서비스 하드 타임아웃 60s 보다 길게(운영자용과 같음). ms
server:
  port: 8080
pmart:
  gateway:
    # 주체 차단 목록(ADR-0054 ⑤, SubjectBlockFilter): 차단된 주체가 차단 전에 받은 토큰 → 401 SUBJECT_BLOCKED. Redis 장애는 통과(결정 H).
    subject-blocklist:
      enabled: true
      max-token-lifetime: PT2H # 모든 발급자의 access token 중 가장 긴 수명보다 길게(고객 30분·직원 15분·비회원 1시간). 수명을 늘리면 같이
      lookup-timeout: PT0.2S
    upstream:
      product-service: http://product-service:8101
      product-content-service: http://product-content-service:8102
      customer-service: http://customer-service:8103
      cart-service: http://cart-service:8104
      search-service: http://search-service:8105
      storefront-service: http://storefront-service:8106
      pricing-service: http://pricing-service:8107
      order-service: http://order-service:8201
      order-orchestration-service: http://order-orchestration-service:8202
      fulfillment-routing-service: http://fulfillment-routing-service:8203
      claim-service: http://claim-service:8204
      payment-service: http://payment-service:8205
      mfc-inventory-service: http://mfc-inventory-service:8301
      mfc-fulfillment-service: http://mfc-fulfillment-service:8302
      cdc-inventory-service: http://cdc-inventory-service:8601
      mfc-capacity-service: http://mfc-capacity-service:8303
      mfc-location-service: http://mfc-location-service:8304
      mfc-quality-service: http://mfc-quality-service:8305
      mfc-inbound-service: http://mfc-inbound-service:8306
      delivery-serviceability-service: http://delivery-serviceability-service:8401
      delivery-capacity-service: http://delivery-capacity-service:8402
      rider-service: http://rider-service:8403
      delivery-dispatch-service: http://delivery-dispatch-service:8404
      delivery-execution-service: http://delivery-execution-service:8405
      delivery-tracking-service: http://delivery-tracking-service:8406
      auth-service: http://auth-service:8501
      rider-auth-service: http://rider-auth-service:8510
      employee-auth-service: http://employee-auth-service:8511
      hr-service: http://hr-service:8512
      keycloak: http://keycloak:8080 # 직원 로그인 화면 /iam(ADR-0056)
      notification-service: http://notification-service:8502
      audit-service: http://audit-service:8503
      backoffice-bff: http://backoffice-bff:8504
      approval-service: http://approval-service:8505
      case-service: http://case-service:8506
      center-master-service: http://center-master-service:8507
      ai-assistant-service: http://ai-assistant-service:8508
      customer-assistant-service: http://customer-assistant-service:8509
    cors:
      # 자격 증명(쿠키) CORS 를 거는 경로(ADR-0059 — 웹 백오피스 refresh 쿠키가 심기고·실리고·지워지는 곳만). 출처는 프로필 파일 credentialed-origins
      credentialed-paths:
        - /api/v1/employee-auth/tokens
        - /api/v1/employee-auth/tokens/refresh/*
        - /api/v1/employee-auth/logouts
    # 인증 없이 통과시키는 작업(계약 security: []). 메서드·경로 모두 일치해야 한다.
    public-paths:
      - method: POST
        path: /api/v1/guest-delivery-addresses # customer-service
      - method: GET
        path: /api/v1/guest-delivery-addresses/* # customer-service
      - method: GET
        path: /api/v1/categories/tree # product-service
      - method: GET
        path: /api/v1/categories/*/filters # product-service
      - method: GET
        path: /api/v1/product-contents # product-content-service
      - method: GET
        path: /api/v1/product-contents/* # product-content-service
      - method: GET
        path: /api/v1/content-images/* # product-content-service
      - method: GET
        path: /api/v1/prices # pricing-service
      - method: GET
        path: /api/v1/prices/* # pricing-service
      - method: POST
        path: /api/v1/serviceability-checks # delivery-serviceability-service
      - method: GET
        path: /api/v1/serviceability-checks/* # delivery-serviceability-service
      - method: GET
        path: /api/v1/search/products # search-service
      - method: GET
        path: /api/v1/search/suggestions # search-service
      - method: GET
        path: /api/v1/search/filters # search-service
      - method: GET
        path: /api/v1/storefront/home # storefront-service
      - method: GET
        path: /api/v1/storefront/tabs/* # storefront-service
      - method: GET
        path: /api/v1/storefront/sections/*/items # storefront-service
      - method: GET
        path: /api/v1/storefront/banners # storefront-service
      - method: POST
        path: /api/v1/webhooks/toss # payment-service
      - method: POST
        path: /api/v1/auth/social-logins # auth-service
      - method: GET
        path: /api/v1/auth/social-logins/* # auth-service
      - method: POST
        path: /api/v1/auth/social-logins/*/completions # auth-service
      - method: POST
        path: /api/v1/auth/tokens # auth-service
      - method: POST
        path: /api/v1/auth/guest-sessions # auth-service (비회원 세션)
      - method: POST
        path: /api/v1/rider-auth/social-logins # rider-auth-service (라이더 Google 로그인)
      - method: GET
        path: /api/v1/rider-auth/social-logins/* # rider-auth-service
      - method: POST
        path: /api/v1/rider-auth/tokens # rider-auth-service
      # employee-auth-service(ADR-0056): 브라우저가 여는 로그인 시작·Keycloak 콜백(302), 티켓 교환·갱신
      - method: GET
        path: /api/v1/employee-auth/logins
      - method: GET
        path: /api/v1/employee-auth/logins/callback
      - method: POST
        path: /api/v1/employee-auth/tokens
      - method: POST
        path: /api/v1/employee-auth/tokens/refresh
      - method: POST
        path: /api/v1/employee-auth/tokens/refresh/* # 쿠키 갱신(ADR-0059) — 토큰 없음, CSRF·소유권은 서비스가 본다
      # Keycloak 로그인 화면 중계(/iam, ADR-0056 결정 11) — PMart 계약이 아니라 Keycloak 의 OIDC·로그인 경로. 라우트(keycloak-iam)와 같은 범위만
      - method: GET
        path: /iam/realms/pmart-staff/protocol/openid-connect/**
      - method: POST
        path: /iam/realms/pmart-staff/protocol/openid-connect/**
      - method: GET
        path: /iam/realms/pmart-staff/login-actions/**
      - method: POST
        path: /iam/realms/pmart-staff/login-actions/**
      - method: GET
        path: /iam/realms/pmart-staff/.well-known/**
      - method: GET
        path: /iam/resources/**
    # 비회원 토큰(typ=GUEST)을 통과시키는 경로. 그 밖에서는 403(각 서비스도 pmart.security.guest-paths 로 같은 규칙).
    guest-paths:
      - /api/v1/carts/**
      - /api/v1/slots
      - /api/v1/delivery-conditions
      - /api/v1/address-geocodes
      - /api/v1/address-reverse-geocodes
      - /api/v1/delivery-options
      - /api/v1/auth/logouts
      - /api/v1/auth/sessions/current
    # 경로별 사용자 종류 허용 목록(ADR-0054 §6.1). 목록은 계약의 x-pmart-user-types 로 만든 생성 파일(access/user-type-allowlist.txt).
    # RECORD: 막지 않고 어긋난 요청을 경고 로그·지표(pmart_gateway_user_type_allowlist_total)로만 — 빠진 경로를 찾는 단계.
    # ENFORCE: 어긋나면 403 USER_TYPE_NOT_ALLOWED(목록에 없는 경로도 거부). OFF: 보지 않음.
    user-type-allowlist:
      mode: RECORD
    # 처리율 제한. 수치는 잠정값(2026-10-23) — 부하 시험·운영 지표로 조정한다. 환경별로 바꾸려면 api-gateway-<프로필>.yml
    rate-limit:
      enabled: true
      trusted-proxies: 1 # Ingress 1단. X-Forwarded-For 의 오른쪽 1개만 신뢰
      anonymous: # 공개 작업(검색·홈·로그인) — IP 단위
        replenish-rate: 10
        burst-capacity: 20
      authenticated: # JWT subject 단위
        replenish-rate: 20
        burst-capacity: 40
      exempt-paths:
        - /api/v1/webhooks/** # PG(토스) 웹훅: 발신 IP 가 몰리고 재전송은 PG 가 관리
management:
  health:
    redis:
      enabled: false # 처리율 제한은 fail-open 이라 Redis 장애로 게이트웨이를 내리지 않는다
