# search-service 고유 설정(모든 프로필). 환경별 값은 search-service-<프로필>.yml, 모든 서비스 공통은 application.yml. ADR-0029
# 옮긴 원본: pmart-backend services/.../application.yml (2026-11-02)
spring:
  autoconfigure:
    # 상태를 갖지 않는 서비스(DB 없음). common-messaging 이 spring-jdbc 를 끌어와 DataSource 자동구성이 켜지므로 끈다.
    # DB(색인·inbox 등)가 생기면 이 제외를 지우고 PMART_DB_* 를 받는다.
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
server:
  port: 8105
pmart:
  messaging:
    domain: commerce
  security:
    # 계약 security: [] 작업(익명). 기본 목록을 덮어쓰므로 actuator·error 도 다시 적는다. 경로마다 메서드가 하나뿐이라 경로 단위 허용이 계약과 일치.
    permit-paths:
      - /actuator/health/**
      - /actuator/info
      - /actuator/prometheus
      - /error
      - /api/v1/search/products
      - /api/v1/search/suggestions
      - /api/v1/search/filters
  search:
    # 최근 검색어(사용자 결정 2026-11-17, Commerce §6.7): 고객 토큰 첫 페이지 검색을 서버가 자동으로 남긴다.
    # 고객마다 최근 max-items 개, retention 이 지난 것은 보이지 않고 매일 지운다. 없으면 남기지 않고 조회는 422 CONFIG_REQUIRED
    recent:
      max-items: 10
      retention: 90d
    # 인기 키워드(사용자 결정 2026-11-17, Commerce §6.9): 최근 window 동안 결과 1건 이상 검색의 검색 횟수 순 size 개,
    # 서로 다른 검색자(고객·비회원 토큰) min-searchers 명 이상이 쓴 검색어만. hidden-keywords = 운영 숨김 목록(부적절한 낱말, 공백 정리·소문자 비교).
    # refresh 동안 메모리 사본. 하나라도 없으면 인기 키워드는 빈 목록(검색 기록도 남기지 않음)
    popular:
      window: 7d
      size: 10
      min-searchers: 2
      hidden-keywords: []
      refresh: 5m
